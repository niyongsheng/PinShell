<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<script type="application/json" id="pinshell:i18n">
{
  "default": "zh-Hans",
  "fallback": "en",
  "languages": {
    "zh-Hans": {
      "meta": {
        "name": "B站粉丝目标",
        "description": "实时读取 B 站粉丝数并显示目标进度"
      }
    },
    "en": {
      "meta": {
        "name": "Bilibili Followers",
        "description": "Live Bilibili follower count with goal progress"
      },
      "ui": {
        "title": "Bilibili followers"
      }
    }
  }
}
</script>
<title>B站粉丝目标</title>
<meta name="description" content="实时读取 B 站粉丝数并显示目标进度">
<meta name="pinshell:size" content="280x64">
<meta name="pinshell:order" content="2">
<link rel="stylesheet" href="design-tokens.css">
<style>
:root {
  color-scheme: light dark;

  /* 深色（默认）：石墨卡片 */
  --card-bg: var(--ps-surface-tile-1);
  --card-border: rgba(255, 255, 255, 0.08);
  --title-ink: var(--ps-body-muted);
  --value-ink: var(--ps-body-on-dark);
  --accent-ink: var(--ps-primary-on-dark);
  --track-bg: rgba(255, 255, 255, 0.10);
  --shimmer: rgba(255, 255, 255, 0.35);
  --dot-idle: #6e6e73;
}

/* 浅色：珍珠白卡片 + Action Blue */
@media (prefers-color-scheme: light) {
  :root {
    --card-bg: rgba(250, 250, 252, 0.94);
    --card-border: rgba(0, 0, 0, 0.08);
    --title-ink: rgba(29, 29, 31, 0.62);
    --value-ink: var(--ps-ink);
    --accent-ink: var(--ps-primary);
    --track-bg: rgba(0, 0, 0, 0.08);
    --shimmer: rgba(255, 255, 255, 0.55);
    --dot-idle: rgba(29, 29, 31, 0.35);
  }
}

.card {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 10px;
  padding: 0 16px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--ps-radius-lg);
  box-sizing: border-box;
}
.head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}
.title {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  letter-spacing: 0.02em;
  color: var(--title-ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.brand {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 16px; height: 16px;
  border-radius: 5px;
  background: #00a1d6;
  color: #fff;
  font-size: 8px;
  font-weight: 800;
  letter-spacing: -0.04em;
}
.live-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--dot-idle);
  transition: background 0.3s ease, box-shadow 0.3s ease;
}
.live-dot.on {
  background: #30d158;
  box-shadow: 0 0 0 3px rgba(48, 209, 88, 0.14);
}
.live-dot.error { background: #ff9f0a; }
.nums {
  font-size: 13px; font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--value-ink);
  white-space: nowrap;
}
.nums .cur { color: var(--accent-ink); }
.track {
  position: relative;
  height: 6px;
  border-radius: var(--ps-radius-pill);
  background: var(--track-bg);
  overflow: hidden;
}
.fill {
  position: relative;
  height: 100%;
  width: 0;
  border-radius: inherit;
  background: linear-gradient(90deg, #FD3532, #FF7A1A);
  transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
}
.fill::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, var(--shimmer), transparent);
  transform: translateX(-100%);
  animation: shimmer 2.4s ease-in-out infinite;
}
@keyframes shimmer {
  0% { transform: translateX(-100%); }
  60%, 100% { transform: translateX(100%); }
}

</style>
</head>
<body>
<div class="card ps-dim-surface">
  <div class="head">
    <span class="title"><span class="brand">B</span><span data-i18n="title">B站粉丝</span><span class="live-dot" id="dot"></span></span>
    <span class="nums"><span class="cur" id="cur">--</span><span id="total"> / 100</span></span>
  </div>
  <div class="track"><div class="fill" id="fill"></div></div>
</div>

<script src="pinshell-i18n.js"></script>
<script>window.PS = window.PS || { lang: 'zh-Hans', locale: 'zh-Hans', languages: [], get: function (k, f) { return f; }, t: function (k, f) { return f; }, list: function (k, f) { return f || []; }, apply: function () {} };</script>
<script>
// ── 配置：把 uid 换成你的 B 站 UID，goal 换成目标粉丝数 ─────────────
const CONFIG = {
  uid: 241980240,   // 倪永胜（可用 B 站个人空间的 UID）
  goal: 100,        // 目标粉丝数
  refreshMs: 60000, // 每分钟刷新一次（通过 pinshell.fetch 原生代理）
};
// ────────────────────────────────────────────────────────────────────

const bridge = window.pinshell || { on() {}, emit() {} };
const curEl = document.getElementById('cur');
const totalEl = document.getElementById('total');
const fillEl = document.getElementById('fill');
const dotEl = document.getElementById('dot');

let current = 52;   // 最近一次已知值；加载后会被实时数据覆盖

function render() {
  const locale = PS.locale;
  curEl.textContent = current.toLocaleString(locale);
  totalEl.textContent = ' / ' + CONFIG.goal.toLocaleString(locale);
  fillEl.style.width = Math.min(100, (current / Math.max(1, CONFIG.goal)) * 100) + '%';
}

function setLive(on, error = false) {
  dotEl.classList.toggle('on', on);
  dotEl.classList.toggle('error', !on && error);
}

function update(followers) {
  const value = Number(followers);
  if (!Number.isFinite(value) || value < 0) return;
  current = value;
  render();
  setLive(true);
}

// B 站接口要求 Referer；HTML 不能自定义 Referer，交给原生 pinshell.fetch 代理
async function fetchFollowers() {
  if (!window.pinshell || typeof window.pinshell.fetch !== 'function') {
    setLive(false);
    return;
  }
  try {
    const text = await window.pinshell.fetch(
      `https://api.bilibili.com/x/relation/stat?vmid=${encodeURIComponent(CONFIG.uid)}`,
      { headers: { Referer: 'https://www.bilibili.com/' } }
    );
    const data = JSON.parse(text);
    if (data && data.code === 0 && data.data) {
      update(data.data.follower);
    } else {
      setLive(false, true);
    }
  } catch (error) {
    setLive(false, true);
  }
}

// 也允许 agent / CLI 直接推送：PinShell emit bilibili:stats '{"followers":123}'
bridge.on('bilibili:stats', data => {
  if (data && (data.followers || data.follower)) {
    update(data.followers ?? data.follower);
  }
});

render();
fetchFollowers();
setInterval(fetchFollowers, CONFIG.refreshMs);
</script>
</body>
</html>
