<title>桌面宠物</title>
<meta name="description" content="会看眼色、能接 AI 指令的桌面小猫：点击、顺毛、提问，还能同步工作状态">
<meta name="pinshell:size" content="200x200">
<meta name="pinshell:radius" content="0">
<meta name="pinshell:order" content="5">
<link rel="stylesheet" href="design-tokens.css">
<!--
  AGENT PROTOCOL · 桌面宠物 v3

  Agent → page (pinshell_emit / CLI emit):
    pet:hello      { name? }                          上线：挥手 + 显示 AI 徽标
    pet:say        { text, mood?, tone?, duration? }  说话；tone: calm|happy|excited|worried|thinking
    pet:mood       { mood, holdMs? }                  idle|happy|thinking|working|excited|sleepy|worried|alert
    pet:task       { label, progress?, status? }      status: running|done|failed|waiting；done/failed 自动收起
    pet:animate    { name }                           jump|spin|shake|dance|wave|nod|dizzy|run|leap|backflip|roll|bounce
    pet:celebrate  { text? }                          彩带 + 跳跃 + 音效
    pet:alert      { text?, level? }                  ❗ + 抖动 + 音效
    pet:reset      {}                                 清空任务/情绪，回到 idle
    agent:message  { text }                           兼容旧协议，等同 pet:say
    agent:presence { online, connected, waiting, count }
                                                      App 派发；online = 有 agent 正在
                                                      poll/await 等事件，connected = 有
                                                      listen 订阅的 agent 会话

  Page → agent (pinshell_poll_events):
    pet:ready      { version, mood, muted, affection, moods[], features[] }
    pet:tap        { area: head|body, count, mood, affection }
    pet:pet        { affection, mood }                被顺毛
    pet:sleep      { at }
    pet:wake       { at }

  Rules: the pet is one-way (agent → page). Page events are queued in PinShell and
  read the next time the agent calls pinshell_poll_events / pinshell_await_event;
  the pet cannot start an agent turn, so it is not a chat input. Keep copy under
  ~40 chars; push at most one update every ~10 s; the pet is fully usable without
  an agent. window.PinShellPet exposes say/mood/animate/task/celebrate/alert/
  reset/state for pinshell_eval.
-->
<style>
  * { box-sizing: border-box; }

  :root {
    --glass: rgba(28, 28, 30, 0.90);
    --line: rgba(255, 255, 255, 0.10);
    --ink: #f5f5f7;
    --muted: rgba(245, 245, 247, 0.62);
    --accent: #ffd479;
    --danger: #ff6b4a;
    --ok: #57d98a;
  }

  body {
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    color: var(--ink);
  }

  /* ── 舞台 ───────────────────────────────────────────────────── */
  .stage {
    position: absolute; inset: 0;
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 6px;
    transition: transform 0.22s ease, opacity 0.22s ease;
    transform-origin: 50% 92%;
  }

  .pet-wrap {
    position: relative;
    width: 136px; height: 132px;
    cursor: pointer;
    animation: float 3.4s ease-in-out infinite;
    filter: drop-shadow(0 10px 12px rgba(0, 0, 0, 0.25));
    transform-origin: 50% 92%;
  }
  .pet-body {
    position: absolute; inset: 0;
    transform-origin: 50% 92%;
  }
  svg { width: 100%; height: 100%; display: block; overflow: visible; }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  /* ── 光环：随情绪换色 ───────────────────────────────────────── */
  .aura {
    position: absolute; left: 50%; top: 54%;
    width: 150px; height: 150px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(242, 166, 90, 0.20), rgba(242, 166, 90, 0) 68%);
    opacity: 0.85;
    pointer-events: none;
    transition: background 0.5s ease, opacity 0.5s ease;
  }
  body[data-mood="happy"] .aura,
  body[data-mood="excited"] .aura {
    background: radial-gradient(circle, rgba(255, 148, 176, 0.24), rgba(255, 148, 176, 0) 68%);
  }
  body[data-mood="thinking"] .aura,
  body[data-mood="working"] .aura {
    background: radial-gradient(circle, rgba(90, 162, 255, 0.23), rgba(90, 162, 255, 0) 68%);
  }
  body[data-mood="worried"] .aura {
    background: radial-gradient(circle, rgba(132, 154, 184, 0.20), rgba(132, 154, 184, 0) 68%);
  }
  body[data-mood="alert"] .aura {
    background: radial-gradient(circle, rgba(255, 107, 74, 0.28), rgba(255, 107, 74, 0) 68%);
    animation: auraPulse 0.9s ease-in-out infinite;
  }
  body[data-mood="sleepy"] .aura { opacity: 0.40; }
  @keyframes auraPulse {
    0%, 100% { opacity: 0.45; transform: translate(-50%, -50%) scale(0.96); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.07); }
  }

  /* ── 基础身体动画 ───────────────────────────────────────────── */
  .tail {
    transform-origin: 118px 112px;
    animation: wag 1.35s ease-in-out infinite;
  }
  @keyframes wag {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-13deg); }
  }
  .eyes-normal { transform-origin: 80px 72px; animation: blink 4.8s infinite; }
  @keyframes blink {
    0%, 43%, 49%, 100% { transform: scaleY(1); }
    46% { transform: scaleY(0.08); }
  }
  .pupils {
    transform: translate(var(--look-x, 0px), var(--look-y, 0px));
    transition: transform 0.16s ease-out;
  }
  .ear-left { transform-origin: 60px 44px; animation: twitch 5.5s ease-in-out infinite; }
  .ear-right { transform-origin: 100px 44px; animation: twitch 5.5s ease-in-out 0.18s infinite; }
  @keyframes twitch {
    0%, 88%, 100% { transform: rotate(0deg); }
    91% { transform: rotate(-7deg); }
    94% { transform: rotate(3deg); }
  }
  @keyframes twitchFast {
    0%, 100% { transform: rotate(0deg); }
    30% { transform: rotate(-9deg); }
    60% { transform: rotate(4deg); }
  }

  .shadow {
    position: absolute; bottom: 0; left: 50%; width: 74px; height: 12px;
    transform: translateX(-50%); border-radius: 50%;
    background: radial-gradient(ellipse, rgba(0, 0, 0, 0.30), rgba(0, 0, 0, 0));
    animation: shadowPulse 3.4s ease-in-out infinite;
  }
  @keyframes shadowPulse {
    0%, 100% { transform: translateX(-50%) scaleX(1); opacity: 0.9; }
    50% { transform: translateX(-50%) scaleX(0.86); opacity: 0.6; }
  }

  /* ── 表情：按 body[data-mood] 切换 ──────────────────────────── */
  .eyes-happy, .eyes-wide, .brows, .mouth-open, .mouth-flat, .mouth-worried,
  .sweat { display: none; }

  body[data-mood="happy"] .eyes-normal,
  body[data-mood="excited"] .eyes-normal,
  body[data-mood="alert"] .eyes-normal { display: none; }
  body[data-mood="happy"] .eyes-happy,
  body[data-mood="excited"] .eyes-happy { display: block; }
  body[data-mood="alert"] .eyes-wide { display: block; }

  body[data-mood="happy"] .mouth-smile,
  body[data-mood="excited"] .mouth-smile,
  body[data-mood="alert"] .mouth-smile,
  body[data-mood="thinking"] .mouth-smile,
  body[data-mood="working"] .mouth-smile,
  body[data-mood="sleepy"] .mouth-smile,
  body[data-mood="worried"] .mouth-smile { display: none; }
  body[data-mood="happy"] .mouth-open,
  body[data-mood="excited"] .mouth-open,
  body[data-mood="alert"] .mouth-open { display: block; }
  body[data-mood="thinking"] .mouth-flat,
  body[data-mood="working"] .mouth-flat,
  body[data-mood="sleepy"] .mouth-flat { display: block; }
  body[data-mood="worried"] .mouth-worried { display: block; }
  body[data-mood="worried"] .brows { display: block; }
  body[data-mood="worried"] .sweat { display: block; }

  body[data-mood="thinking"] .pupils { --look-x: 1.8px; --look-y: -2.4px; }
  body[data-mood="worried"] .pupils { --look-x: 0px; --look-y: 1.2px; }

  body[data-mood="happy"] .tail { animation-duration: 0.85s; }
  body[data-mood="excited"] .tail { animation-duration: 0.5s; }
  body[data-mood="alert"] .tail { animation-duration: 0.6s; }
  body[data-mood="sleepy"] .tail { animation-duration: 4.6s; }

  body[data-mood="thinking"] .pet-wrap { animation-duration: 4.6s; }
  body[data-mood="working"] .pet-wrap { animation-duration: 4.6s; }
  body[data-mood="sleepy"] .pet-wrap { animation-duration: 6.6s; }
  body[data-mood="excited"] .pet-wrap { animation-duration: 1.7s; }
  body[data-mood="sleepy"] .eyes-normal { animation: none; transform: scaleY(0.08); }
  body[data-mood="alert"] .ear-left,
  body[data-mood="alert"] .ear-right { animation: none; transform: rotate(-8deg); }
  body[data-mood="sleepy"] .ear-left,
  body[data-mood="sleepy"] .ear-right { animation-play-state: paused; }

  /* ── 情绪小徽标 ─────────────────────────────────────────────── */
  .zzz {
    position: absolute; top: 2px; right: 0;
    padding: 2px 6px;
    border-radius: 8px;
    background: rgba(28, 28, 30, 0.66);
    border: 1px solid rgba(255, 255, 255, 0.08);
    font-size: 9.5px; font-weight: 600; letter-spacing: 0.06em;
    color: rgba(255, 255, 255, 0.8);
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
  }
  body[data-mood="sleepy"] .zzz {
    opacity: 1;
    animation: zzzFloat 2.8s ease-in-out infinite;
  }
  @keyframes zzzFloat {
    0%, 100% { transform: translateY(0) rotate(-4deg); opacity: 0.25; }
    50% { transform: translateY(-5px) rotate(4deg); opacity: 0.75; }
  }

  .think-dots {
    position: absolute; right: 0; top: 16px;
    display: none; gap: 3px; align-items: center;
    padding: 5px 7px;
    border-radius: 10px;
    background: var(--glass);
    border: 1px solid var(--line);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
    pointer-events: none;
  }
  body[data-mood="thinking"] .think-dots { display: flex; }
  .think-dots i {
    width: 4px; height: 4px; border-radius: 50%;
    background: #9ec5ff;
    animation: dotPulse 1.1s ease-in-out infinite;
  }
  .think-dots i:nth-child(2) { animation-delay: 0.14s; }
  .think-dots i:nth-child(3) { animation-delay: 0.28s; }
  @keyframes dotPulse {
    0%, 100% { opacity: 0.25; transform: translateY(0); }
    50% { opacity: 1; transform: translateY(-2px); }
  }

  .alert-badge {
    position: absolute; left: 0; top: 10px;
    width: 16px; height: 16px;
    display: none; align-items: center; justify-content: center;
    border-radius: 50%;
    background: var(--danger);
    color: #2a0d05;
    font-size: 11px; font-weight: 800; line-height: 1;
    box-shadow: 0 2px 10px rgba(255, 80, 60, 0.55);
    pointer-events: none;
  }
  body[data-mood="alert"] .alert-badge {
    display: flex;
    animation: badgePop 0.9s ease-in-out infinite;
  }
  @keyframes badgePop {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.16); }
  }

  .thought {
    position: absolute; right: -6px; top: 8px;
    max-width: 100px;
    padding: 5px 8px;
    border-radius: 10px;
    background: var(--glass);
    border: 1px solid var(--line);
    color: rgba(255, 255, 255, 0.9);
    font-size: 9.5px; line-height: 1.3; text-align: center;
    opacity: 0; transform: translateY(4px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events: none;
  }
  .thought.show { opacity: 1; transform: translateY(0); }

  /* ── 顶部 HUD：任务条 + 对话气泡 ────────────────────────────── */
  .hud {
    position: absolute; top: 6px; left: 8px; right: 8px;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    z-index: 5; pointer-events: none;
    transition: opacity 0.18s ease;
  }

  .task {
    position: relative;
    display: flex; align-items: center; gap: 6px;
    max-width: 100%;
    padding: 5px 9px;
    border-radius: 10px;
    background: var(--glass);
    border: 1px solid var(--line);
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.30);
    font-size: 10.5px; line-height: 1.2;
    overflow: hidden;
    opacity: 0; transform: translateY(-4px);
    transition: opacity 0.18s ease, transform 0.18s ease;
  }
  .task[hidden] { display: none; }
  .task.show { opacity: 1; transform: translateY(0); }
  .task-icon { flex: none; width: 11px; height: 11px; display: flex; align-items: center; justify-content: center; font-size: 10px; }
  .task-icon.spinner {
    border: 1.5px solid rgba(255, 255, 255, 0.25);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: taskSpin 0.8s linear infinite;
  }
  @keyframes taskSpin { to { transform: rotate(360deg); } }
  .task-label {
    flex: 0 1 auto; min-width: 0; max-width: 132px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .task-pct { flex: none; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 9.5px; }
  .task[data-status="done"] .task-icon { color: var(--ok); }
  .task[data-status="done"] .task-fill { background: var(--ok); }
  .task[data-status="failed"] .task-icon { color: var(--danger); }
  .task[data-status="failed"] .task-fill { background: var(--danger); }
  .task[data-status="waiting"] .task-icon { color: var(--accent); }
  .task-track {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 2px; background: rgba(255, 255, 255, 0.08);
    opacity: 0; transition: opacity 0.2s ease;
  }
  .task.has-progress .task-track { opacity: 1; }
  .task-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #ffd479, #ff9f0a);
    transition: width 0.3s ease;
  }

  .speech {
    position: relative;
    max-width: 100%;
    padding: 7px 11px;
    border-radius: 12px;
    background: var(--glass);
    border: 1px solid var(--line);
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.30);
    color: var(--ink);
    font-size: 11px; line-height: 1.35; text-align: center;
    opacity: 0; transform: translateY(3px) scale(0.96);
    transition: opacity 0.18s ease, transform 0.18s ease;
    pointer-events: none;
  }
  .speech.show { opacity: 1; transform: translateY(0) scale(1); }
  .speech::after {
    content: ''; position: absolute; bottom: -5px; left: 50%;
    width: 10px; height: 10px; transform: translateX(-50%) rotate(45deg);
    background: var(--glass);
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .speech-text {
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* ── 粒子层 ─────────────────────────────────────────────────── */
  .hearts, .confetti, .sparkles {
    position: absolute; inset: 0;
    pointer-events: none; overflow: hidden;
  }
  .hearts { z-index: 4; }
  .confetti { z-index: 5; }
  .sparkles { z-index: 3; }
  .heart {
    position: absolute; font-size: 12px; color: #ff6b8b;
    animation: heartUp 1.1s ease-out forwards;
  }
  @keyframes heartUp {
    0% { opacity: 0; transform: translateY(0) scale(0.6); }
    20% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-46px) scale(1.15); }
  }
  .confetti-piece {
    position: absolute; top: -8px;
    width: 5px; height: 7px; border-radius: 1px;
    animation: confettiFall 1.5s ease-in forwards;
  }
  @keyframes confettiFall {
    0% { opacity: 0; transform: translateY(0) rotate(0deg); }
    10% { opacity: 1; }
    100% { opacity: 0; transform: translateY(210px) rotate(540deg); }
  }
  .spark {
    position: absolute; font-size: 9px;
    animation: sparkUp 1.2s ease-out forwards;
  }
  @keyframes sparkUp {
    0% { opacity: 0; transform: translateY(0) scale(0.5); }
    25% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-38px) scale(1.1); }
  }

  /* ── 行为动画（挂在 pet-wrap，作用在 pet-body / 五官上）───────── */
  .anim-jump .pet-body { animation: jump 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); }
  @keyframes jump {
    0% { transform: translateY(0) scale(1, 1); }
    35% { transform: translateY(-17px) scale(0.96, 1.05); }
    65% { transform: translateY(0) scale(1.05, 0.95); }
    100% { transform: translateY(0) scale(1, 1); }
  }
  .anim-jump .shadow { animation: shadowJump 0.5s ease; }
  @keyframes shadowJump {
    0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.9; }
    40% { transform: translateX(-50%) scale(0.78); opacity: 0.45; }
  }

  .anim-spin .pet-body { animation: spinPet 0.7s cubic-bezier(0.4, 0, 0.2, 1); }
  @keyframes spinPet {
    0% { transform: rotate(0deg) translateY(0); }
    50% { transform: rotate(180deg) translateY(-8px); }
    100% { transform: rotate(360deg) translateY(0); }
  }

  .anim-shake .pet-body { animation: shake 0.5s ease-in-out; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-4px) rotate(-2deg); }
    40% { transform: translateX(4px) rotate(2deg); }
    60% { transform: translateX(-3px); }
    80% { transform: translateX(2px); }
  }

  .anim-dance .pet-body { animation: dance 1.2s ease-in-out; }
  @keyframes dance {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    20% { transform: rotate(-7deg) translateY(-3px); }
    40% { transform: rotate(6deg) translateY(0); }
    60% { transform: rotate(-5deg) translateY(-3px); }
    80% { transform: rotate(4deg) translateY(0); }
  }
  .anim-dance .tail { animation-duration: 0.4s; }

  .anim-wave .pet-body { animation: wave 0.9s ease-in-out; }
  @keyframes wave {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-6deg) translateY(-2px); }
    50% { transform: rotate(2deg); }
    75% { transform: rotate(-5deg) translateY(-2px); }
  }
  .anim-wave .ear-left, .anim-wave .ear-right { animation: twitchFast 0.45s ease-in-out 2; }

  .anim-nod .pet-body { animation: nod 0.7s ease-in-out; }
  @keyframes nod {
    0%, 100% { transform: translateY(0); }
    30% { transform: translateY(4px) rotate(2deg); }
    60% { transform: translateY(3px) rotate(-1deg); }
  }

  .anim-dizzy .pet-body { animation: dizzyWobble 0.35s ease-in-out 4; }
  @keyframes dizzyWobble {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-5deg); }
    75% { transform: rotate(5deg); }
  }
  .anim-dizzy .pupils {
    animation: eyeSpin 0.7s linear 2;
    transform-box: fill-box;
    transform-origin: center;
  }
  @keyframes eyeSpin { to { transform: rotate(360deg); } }

  /* ── 大幅动作：跑动 / 鱼跃 / 后空翻 / 打滚 / 连跳 ────────────── */
  .anim-run .pet-body { animation: runPet 2.1s cubic-bezier(0.45, 0.05, 0.55, 0.95); }
  @keyframes runPet {
    0%   { transform: translateX(0) translateY(0) rotate(0deg) scale(1, 1); }
    6%   { transform: translateX(-2px) translateY(2px) rotate(-2deg) scale(1.06, 0.94); }
    16%  { transform: translateX(14px) translateY(-11px) rotate(5deg) scale(0.94, 1.06); }
    26%  { transform: translateX(28px) translateY(-1px) rotate(3deg) scale(1.03, 0.97); }
    36%  { transform: translateX(27px) translateY(-11px) rotate(1deg) scale(0.95, 1.05); }

  const reduceMotion = window.matchMedia

  let mood = 'idle';

  // ── 宠物台词 ─────────────────────────────────────────────────
  const WAKE_LINES = PS.list('wakeLines',
    ['唔…几点了', '我没睡，我在想事情', '再睡五分钟…', '你回来啦 ✨', '伸个懒腰～']);

  function headLines() {

      return PS.list('headLinesHigh',

  function loadMuted() {
    try { return localStorage.getItem(MUTED_KEY) === '1'; } catch (error) { return false; }
  }
  function loadAffection() {
    try {
      const value = Number(localStorage.getItem(AFFECTION_KEY));
      return Number.isFinite(value) && value > 0 ? Math.floor(value) : 0;
    } catch (error) { return 0; }
  }
  function saveAffection() {
    try { localStorage.setItem(AFFECTION_KEY, String(affection)); } catch (error) {}
  }

  // ── 声音：Web Audio 合成，不依赖外部文件 ───────────────────────
  const SPEAKER_ON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h2.1L8.4 3.6v8.8L5.1 10H3z"/><path d="M10.7 6.1a2.7 2.7 0 0 1 0 3.8"/><path d="M12.4 4.4a5.1 5.1 0 0 1 0 7.2"/></svg>';
  const SPEAKER_OFF = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h2.1L8.4 3.6v8.8L5.1 10H3z"/><path d="m10.8 6.2 3.4 3.6m0-3.6-3.4 3.6"/></svg>';

  let audioContext = null;

  function ensureAudio() {
    const AudioCtor = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtor) return null;
    if (!audioContext) {
      try { audioContext = new AudioCtor(); } catch (error) { return null; }
    }
    if (audioContext.state === 'suspended') audioContext.resume().catch(() => {});
    return audioContext;
  }

  function tone(options) {
    if (muted) return;
    const ctx = ensureAudio();
    if (!ctx) return;
    const {
      frequency, endFrequency, type = 'sine',
      duration = 0.25, gain = 0.06, delay = 0,
    } = options;
    try {
      const start = ctx.currentTime + delay;
      const osc = ctx.createOscillator();
      const filter = ctx.createBiquadFilter();
      const env = ctx.createGain();

      filter.type = 'lowpass';
      filter.frequency.value = 2400;
      osc.type = type;
      osc.frequency.setValueAtTime(frequency, start);
      if (endFrequency && endFrequency !== frequency) {
        osc.frequency.exponentialRampToValueAtTime(endFrequency, start + duration * 0.85);
      }
      env.gain.setValueAtTime(0.0001, start);
      env.gain.exponentialRampToValueAtTime(gain, start + 0.015);
      env.gain.exponentialRampToValueAtTime(0.0001, start + duration);

      osc.connect(filter).connect(env).connect(ctx.destination);
      osc.start(start);
      osc.stop(start + duration + 0.02);
    } catch (error) {}
  }

  function meow(scale = 1) {
    tone({ frequency: 560 * scale, endFrequency: 860 * scale, type: 'triangle',
           duration: 0.3, gain: 0.075 });
    tone({ frequency: 1180 * scale, endFrequency: 940 * scale, type: 'sine',
           duration: 0.22, gain: 0.02, delay: 0.03 });
  }
  function chime() {
    tone({ frequency: 880, duration: 0.45, gain: 0.05 });
    tone({ frequency: 1318.51, duration: 0.55, gain: 0.045, delay: 0.12 });
  }
  function purr() {
    tone({ frequency: 190, endFrequency: 150, type: 'sine', duration: 0.9, gain: 0.022 });
  }
  function pop() {
    tone({ frequency: 420, endFrequency: 560, type: 'sine', duration: 0.12, gain: 0.04 });
  }
  function giggle() {
    tone({ frequency: 720, endFrequency: 980, type: 'triangle', duration: 0.1, gain: 0.05 });
    tone({ frequency: 760, endFrequency: 1020, type: 'triangle', duration: 0.1,
           gain: 0.045, delay: 0.11 });
  }
  function successSound() {
    [660, 880, 1318.51].forEach((frequency, index) => {
      tone({ frequency, duration: 0.35, gain: 0.045, delay: index * 0.09 });
    });
  }
  function alertSound() {
    tone({ frequency: 880, endFrequency: 660, type: 'square', duration: 0.16, gain: 0.03 });
    tone({ frequency: 880, endFrequency: 660, type: 'square', duration: 0.16,
           gain: 0.03, delay: 0.2 });
  }
  function renderSound() {
    soundBtn.innerHTML = muted ? SPEAKER_OFF : SPEAKER_ON;
    soundBtn.classList.toggle('muted', muted);
    soundBtn.title = muted
      ? PS.t('soundOn', '开启声音')
      : PS.t('soundOff', '关闭声音');
    soundBtn.setAttribute('aria-label', soundBtn.title);
  }

  soundBtn.addEventListener('click', event => {
    event.stopPropagation();
    muted = !muted;
    try { localStorage.setItem(MUTED_KEY, muted ? '1' : '0'); } catch (error) {}
    renderSound();
    if (muted) {
      say(PS.t('muted', '已静音'), { duration: 1400 });
    } else {
      pop();
      say(PS.t('unmuted', '声音已开启'), { duration: 1400 });
    }
  });

  // ── 情绪 ─────────────────────────────────────────────────────
  function restingMood() {
    if (activeTask) {
      if (activeTask.status === 'running') return 'working';
      if (activeTask.status === 'waiting') return 'thinking';
    }
    return 'idle';
  }

  function setMood(next, holdMs = 0) {
    if (!MOODS.includes(next)) return;
    clearTimeout(moodTimer);
    mood = next;
    document.body.dataset.mood = next;
    sleeping = next === 'sleepy';
    if (sleeping) {
      clearTimeout(sleepTimer);
    } else {
      scheduleSleep();
    }
    if (holdMs > 0 && next !== 'sleepy') {
      moodTimer = setTimeout(() => {
        if (mood === next) setMood(restingMood());
      }, holdMs);
    }
  }

  function toneToMood(tone) {
    switch (tone) {
      case 'happy': return 'happy';
      case 'excited': return 'excited';
      case 'worried': return 'worried';
      case 'thinking': return 'thinking';
      default: return '';
    }
  }

  // ── 说话 ─────────────────────────────────────────────────────
  function say(text, options = {}) {
    const value = String(text == null ? '' : text).trim().slice(0, 160);
    if (!value) {
      speech.classList.remove('show');
      return;
    }
    clearInterval(typeTimer);
    clearTimeout(speechTimer);

    speechText.textContent = '';
    speech.classList.add('show');

    const chars = Array.from(value);
    let index = 0;
    typeTimer = setInterval(() => {
      index += 1;
      speechText.textContent = chars.slice(0, index).join('');
      if (index >= chars.length) {
        clearInterval(typeTimer);
        typeTimer = null;
      }
    }, 16);

    const duration = Number(options.duration);
    const hold = Number.isFinite(duration) && duration > 0
      ? Math.min(duration, 12000)
      : Math.min(7200, Math.max(2400, 1300 + value.length * 95));

    speechTimer = setTimeout(() => speech.classList.remove('show'), hold);
  }

  function pickLine(pool) {
    if (!Array.isArray(pool) || pool.length === 0) return '';
    const options = pool.length > 1 ? pool.filter(line => line !== lastLine) : pool;
    const line = options[Math.floor(Math.random() * options.length)];
    lastLine = line;
    return line;
  }

  function localSay(pool, options) {
    say(pickLine(pool), options);
  }

  // ── 睡眠 / 唤醒 ───────────────────────────────────────────────
  // agent 正在长轮询页面事件：此刻页面操作能被立即看到。
  function agentOnline() {
    return agentWaiting;
  }

  // 最近有 agent 活动（事件或连接），只用来控制作息，不代表可回复。
  function agentAround() {
    return agentConnected || Date.now() - agentLastAt < AGENT_ONLINE_MS;
  }

  function scheduleSleep() {
    clearTimeout(sleepTimer);
    if (sleeping) return;
    const delay = agentAround() ? AGENT_SLEEP_AFTER : SLEEP_AFTER;
    sleepTimer = setTimeout(fallAsleep, delay);
  }

  function fallAsleep() {
    if (sleeping || document.hidden) {
      scheduleSleep();
      return;
    }
    setMood('sleepy');
    purr();
    emit('pet:sleep', { at: Date.now() });
  }

  function wakeUp(quiet = false) {
    if (!sleeping) {
      scheduleSleep();
      return;
    }
    setMood('idle');
    emit('pet:wake', { at: Date.now() });
    if (!quiet) {
      localSay(WAKE_LINES, { duration: 2300 });
      meow(0.82);
      spawnHearts(2);
      pulse('anim-stretch', 1500);
    }
  }

  // ── 点击 / 摸头 / 顺毛 ────────────────────────────────────────
  function react(event) {
    const wasSleeping = sleeping;
    const rect = pet.getBoundingClientRect();
    const relativeY = (event.clientY - rect.top) / rect.height;
    const area = relativeY < 0.52 ? 'head' : 'body';

    if (wasSleeping) {
      taps = 0;
      wakeUp();
      emit('pet:tap', { area, count: 1, mood, affection, woke: true });
      return;
    }

    wakeUp(true);
    const now = Date.now();
    if (now - tapAt > 2500) taps = 0;
    tapAt = now;
    taps += 1;
    const count = taps;

    clearTimeout(tapTimer);
    tapTimer = setTimeout(() => { taps = 0; }, 2500);

    if (taps >= 5) {
      taps = 0;
      setMood('worried', 2600);
      pulse('anim-dizzy', 1400);
      spawnSparkles(5, '#ffd479');
      localSay(DIZZY_LINES, { duration: 2000 });
      meow(1.15);
    } else if (area === 'head') {
      addAffection(1);
      setMood(taps >= 3 ? 'excited' : 'happy', taps >= 3 ? 3200 : 4200);
      spawnHearts(2 + Math.floor(Math.random() * 3));
      spawnSparkles(2, '#ffb3c2');
      localSay(headLines(), { duration: 2200 });
      meow(0.9 + (taps % 5) * 0.05);
    } else {
      setMood('happy', 3000);
      spawnHearts(1);
      pulse('anim-shake', 420);
      localSay(POKE_LINES, { duration: 2000 });
      giggle();
    }

    emit('pet:tap', { area, count, mood, affection, woke: false });
  }

  function addAffection(amount) {
    const before = affection;
    affection = Math.max(0, affection + amount);
    saveAffection();
    const milestones = [
      { at: 10, line: PS.t('milestone10', '我们算熟了吧？') },
      { at: 30, line: PS.t('milestone30', '你是我最好的搭档 ♥') },
      { at: 60, line: PS.t('milestone60', '离不开你了。') },
    ];
    for (const milestone of milestones) {
      if (before < milestone.at && affection >= milestone.at) {
        setTimeout(() => {
          setMood('excited', 4000);
          spawnHearts(5);
          spawnSparkles(6, '#ffd479');
          say(milestone.line, { duration: 3200 });
          chime();
        }, 700);
        break;
      }
    }
  }

  function petStroke() {
    addAffection(1);
    setMood('happy', 4800);
    spawnHearts(3);
    spawnSparkles(3, '#ffb3c2');
    purr();
    pulse('anim-purr', 1100);
    if (Math.random() < 0.45) {
      localSay(PURR_LINES, { duration: 2000 });
    }
    emit('pet:pet', { affection, mood });
  }

  pet.addEventListener('click', react);

  pet.addEventListener('pointermove', event => {
    const now = Date.now();
    if (stroke.lastX == null || now - stroke.lastAt > 600) {
      stroke.lastX = event.clientX;
      stroke.dir = 0;
      stroke.flips = 0;
      stroke.lastAt = now;
      return;
    }
    const dx = event.clientX - stroke.lastX;
    if (Math.abs(dx) < 3) return;

    const dir = Math.sign(dx);
    if (stroke.dir && dir !== stroke.dir) stroke.flips += 1;
    stroke.dir = dir;
    stroke.lastX = event.clientX;
    stroke.lastAt = now;

    if (stroke.flips >= 4 && now - stroke.lastPurr > 2500) {
      stroke.flips = 0;
      stroke.lastPurr = now;
      petStroke();
    }
  });

  // 眼睛跟随光标（窗口内）
  document.addEventListener('pointermove', event => {
    const rect = pet.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height * 0.52;
    const x = Math.max(-2.6, Math.min(2.6, (event.clientX - cx) / 42));
    const y = Math.max(-2.2, Math.min(2.2, (event.clientY - cy) / 42));
    pet.style.setProperty('--look-x', x.toFixed(2) + 'px');
    pet.style.setProperty('--look-y', y.toFixed(2) + 'px');
  });

  document.addEventListener('pointerleave', () => {
    pet.style.setProperty('--look-x', '0px');
    pet.style.setProperty('--look-y', '0px');
    stroke.lastX = null;
    stroke.flips = 0;
  });

  // ── 粒子 / 动画 ──────────────────────────────────────────────
  function spawnHearts(count = 3) {
    for (let i = 0; i < count; i += 1) {
      const heart = document.createElement('span');
      heart.className = 'heart';
      heart.textContent = '♥';
      heart.style.left = (50 + (Math.random() - 0.5) * 56) + '%';
      heart.style.bottom = (36 + Math.random() * 18) + 'px';
      heart.style.animationDelay = (i * 70) + 'ms';
      hearts.appendChild(heart);
      setTimeout(() => heart.remove(), 1400 + i * 70);
    }
  }

  function spawnSparkles(count = 3, color = '#ffd479') {
    for (let i = 0; i < count; i += 1) {
      const spark = document.createElement('span');
      spark.className = 'spark';
      spark.textContent = '✦';
      spark.style.color = color;
      spark.style.left = (36 + Math.random() * 40) + '%';
      spark.style.bottom = (52 + Math.random() * 34) + 'px';
      spark.style.animationDelay = (i * 90) + 'ms';
      sparkles.appendChild(spark);
      setTimeout(() => spark.remove(), 1400 + i * 90);
    }
  }

  function spawnConfetti(count = 18) {
    const colors = ['#ffd479', '#ff8fab', '#7fd0c2', '#9ec5ff', '#ffe8cc'];
    const total = reduceMotion ? Math.min(8, count) : count;
    for (let i = 0; i < total; i += 1) {
      const piece = document.createElement('span');
      piece.className = 'confetti-piece';
      piece.style.left = (8 + Math.random() * 84) + '%';
      piece.style.background = colors[i % colors.length];
      piece.style.animationDelay = (Math.random() * 260) + 'ms';
      piece.style.transform = 'rotate(' + Math.floor(Math.random() * 180) + 'deg)';
      confetti.appendChild(piece);
      setTimeout(() => piece.remove(), 2000);
    }
  }

  function pulse(className, duration) {
    for (const [name, timer] of animTimers) {
      clearTimeout(timer);
      pet.classList.remove(name);
    }
    animTimers.clear();
    pet.classList.add(className);
    const timer = setTimeout(() => {
      pet.classList.remove(className);
      animTimers.delete(className);
    }, duration);
    animTimers.set(className, timer);
  }

  const ANIMATIONS = {
    jump: ['anim-jump', 520],
    spin: ['anim-spin', 720],
    shake: ['anim-shake', 520],
    dance: ['anim-dance', 1240],
    wave: ['anim-wave', 940],
    nod: ['anim-nod', 720],
    dizzy: ['anim-dizzy', 1450],
    run: ['anim-run', 2150],
    leap: ['anim-leap', 1200],
    backflip: ['anim-backflip', 1100],
    roll: ['anim-roll', 1400],
    bounce: ['anim-bounce', 1300],
  };

  function animate(name) {
    const entry = ANIMATIONS[name];
    if (!entry) return;
    if (sleeping) wakeUp(true);
    pulse(entry[0], entry[1]);
  }

  // ── 顶部任务条 ───────────────────────────────────────────────
  function setTask(data) {
    let payload = data;
    if (typeof payload === 'string') payload = { label: payload };
    if (!payload || typeof payload !== 'object') return;

    presence();
    wakeUp(true);

    const label = String(payload.label || payload.text || '').trim().slice(0, 60);
    if (!label) {
      clearTask();
      return;
    }

    const status = ['running', 'done', 'failed', 'waiting'].includes(payload.status)
      ? payload.status
      : 'running';
    const rawProgress = Number(payload.progress);
    const progress = Number.isFinite(rawProgress)
      ? Math.max(0, Math.min(1, rawProgress))
      : null;

    activeTask = { label, status, progress };
    taskLabel.textContent = label;
    taskEl.dataset.status = status;
    taskEl.classList.toggle('has-progress', progress != null);
    taskPct.hidden = progress == null;
    taskPct.textContent = progress == null ? '' : Math.round(progress * 100) + '%';
    taskFill.style.width = (progress == null ? 0 : progress * 100) + '%';

    taskIcon.className = 'task-icon';
    taskIcon.textContent = '';
    clearTimeout(taskTimer);

    if (status === 'done') {
      taskIcon.textContent = '✓';
      setMood('happy', 4200);
      taskTimer = setTimeout(clearTask, 4200);
    } else if (status === 'failed') {
      taskIcon.textContent = '✕';
      setMood('alert', 5200);
      taskTimer = setTimeout(clearTask, 5200);
    } else if (status === 'waiting') {
      taskIcon.textContent = '⏳';
      setMood('thinking');
      taskOwnsMood = true;
    } else {
      taskIcon.classList.add('spinner');
      setMood('working');
      taskOwnsMood = true;
    }

    taskEl.hidden = false;
    requestAnimationFrame(() => taskEl.classList.add('show'));
  }

  function clearTask() {
    clearTimeout(taskTimer);
    taskTimer = null;
    activeTask = null;
    taskEl.classList.remove('show');
    setTimeout(() => {
      if (!activeTask) taskEl.hidden = true;
    }, 200);
    taskFill.style.width = '0%';
    if (taskOwnsMood && (mood === 'working' || mood === 'thinking')) {
      setMood('idle');
    }
    taskOwnsMood = false;
  }

  // ── AI 在线状态 ──────────────────────────────────────────────
  // 只有 agent 正在 poll/await 时徽标才常亮；最近的事件会让它多停留一会儿。
  function presence() {
    agentLastAt = Date.now();
    updatePresenceUI();
    clearTimeout(badgeTimer);
    if (!agentWaiting) {
      badgeTimer = setTimeout(updatePresenceUI, AGENT_ONLINE_MS);
    }
    scheduleSleep();
  }

  function updatePresenceUI() {
    const online = agentWaiting || Date.now() - agentLastAt < AGENT_ONLINE_MS;
    aiBadge.classList.toggle('show', online);
    aiBadge.setAttribute('aria-hidden', online ? 'false' : 'true');
  }

  // ── 闲置小动作 ───────────────────────────────────────────────
  const DAYDREAMS = PS.list('daydreams',
    ['小鱼干…', '今天的代码会很顺吧', '想晒太阳', '楼下那只鸟又来了', '午睡是正经事']);
  const CARE_LINES = PS.list('careLines',
    ['起来伸个懒腰吧', '眼睛累了吧，看看远处', '喝口水 🥤', '坐太久啦，动一动']);

  function scheduleIdle() {
    clearTimeout(idleTimer);
    if (document.hidden || sleeping) return;
    idleTimer = setTimeout(() => {
      runIdle();
      scheduleIdle();
    }, 7000 + Math.random() * 9000);
  }

  function runIdle() {
    if (document.hidden || sleeping) return;
    if (mood === 'alert' || mood === 'thinking' || mood === 'working') {
      if (Math.random() < 0.6) return;
    }
    const roll = Math.random();
    if (roll < 0.26) {
      lookAround();
    } else if (roll < 0.44) {
      pulse('anim-yawn', 1500);
    } else if (roll < 0.60) {
      pulse('anim-stretch', 1800);
    } else if (roll < 0.72) {
      pulse('anim-groom', 1600);
    } else if (roll < 0.84) {
      daydream();
    } else if (roll < 0.94) {
      pulse('anim-ear', 900);
    } else {
      localSay(CARE_LINES, { duration: 3200 });
    }
  }

  function lookAround() {
    const x = (Math.random() < 0.5 ? -1 : 1) * (1.2 + Math.random() * 1.2);
    const y = (Math.random() - 0.5) * 2;
    pet.style.setProperty('--look-x', x.toFixed(2) + 'px');
    pet.style.setProperty('--look-y', y.toFixed(2) + 'px');
    setTimeout(() => {
      pet.style.setProperty('--look-x', '0px');
      pet.style.setProperty('--look-y', '0px');
    }, 1500);
  }

  function daydream() {
    thought.textContent = pickLine(DAYDREAMS);
    thought.classList.add('show');
    clearTimeout(thoughtTimer);
    thoughtTimer = setTimeout(() => thought.classList.remove('show'), 3200);
  }

  // ── agent → page ─────────────────────────────────────────────
  function emit(name, data) {
    try { bridge.emit(name, data); } catch (error) {}
  }

  function listen(name, handler) {
    try {
      bridge.on(name, data => {
        try { handler(data); } catch (error) {
          try { bridge.log('pet: ' + (error && error.message ? error.message : error)); } catch (e) {}
        }
      });
    } catch (error) {}
  }

  function handleHello(data) {
    presence();
    wakeUp(true);
    animate('wave');
    chime();
    spawnSparkles(3, '#ffd479');
  }

  function handleSay(data) {
    const payload = typeof data === 'string' ? { text: data } : (data || {});
    const text = String(payload.text || payload.message || '').trim();
    if (!text) return;

    presence();
    wakeUp(true);

    const nextMood = payload.mood || toneToMood(payload.tone);
    if (nextMood) setMood(String(nextMood), Number(payload.holdMs) || 0);
    say(text, { duration: payload.duration });
    if (nextMood === 'excited') pop();
  }

  function handleMood(data) {
    const payload = typeof data === 'string' ? { mood: data } : (data || {});
    const next = String(payload.mood || '');
    if (!MOODS.includes(next)) return;
    presence();
    wakeUp(true);
    setMood(next, Number(payload.holdMs) || 0);
  }

  function celebrate(data) {
    const text = typeof data === 'string' ? data : (data && data.text);
    presence();
    wakeUp(true);
    setMood('happy', 6200);
    animate('jump');
    spawnConfetti(20);
    spawnSparkles(6, '#ffd479');
    successSound();
    if (text) say(text, { duration: 5200 });
  }

  function petAlert(data) {
    const payload = typeof data === 'string' ? { text: data } : (data || {});
    presence();
    wakeUp(true);
    setMood('alert', 6200);
    animate('shake');
    alertSound();
    say(payload.text || PS.t('alertDefault', '需要你看一下！'), { duration: 5200 });
  }

  function resetAll() {
    clearTask();
    clearTimeout(thoughtTimer);
    thought.classList.remove('show');
    speech.classList.remove('show');
    setMood('idle');
    taskOwnsMood = false;
  }

  listen('pet:hello', handleHello);
  listen('pet:say', handleSay);
  listen('agent:message', handleSay);
  listen('pet:mood', handleMood);
  listen('pet:task', setTask);
  listen('pet:animate', data => {
    animate(typeof data === 'string' ? data : (data && (data.name || data.animate)));
  });
  listen('pet:celebrate', celebrate);
  listen('pet:alert', petAlert);
  listen('pet:reset', resetAll);
  listen('agent:presence', data => {
    const payload = data && typeof data === 'object' ? data : {};
    const waiting = payload.waiting != null ? !!payload.waiting : !!payload.online;
    const connected = payload.connected != null ? !!payload.connected : !!payload.online;
    if (waiting === agentWaiting && connected === agentConnected) {
      updatePresenceUI();
      return;
    }
    agentWaiting = waiting;
    agentConnected = connected;
    clearTimeout(badgeTimer);
    if (!waiting) {
      badgeTimer = setTimeout(updatePresenceUI, AGENT_ONLINE_MS);
    }
    updatePresenceUI();
    scheduleSleep();
  });

  window.PinShellPet = {
    version: VERSION,
    get state() {
      return {
        mood, sleeping, muted, affection,
        agentConnected,
        agentWaiting,
        agentOnline: agentOnline(),
        task: activeTask,
      };
    },
    say,
    mood: setMood,
    animate,
    task: setTask,
    celebrate,
    alert: petAlert,
    reset: resetAll,
  };

  // ── 问候 / 久坐提醒 / 可见性 ─────────────────────────────────
  function greet() {
    const hour = new Date().getHours();
    let line;
    if (hour >= 5 && hour < 10) line = PS.t('greetMorning', '早呀 ☀️');
    else if (hour < 12) line = PS.t('greetLateMorning', '上午好～');
    else if (hour < 14) line = PS.t('greetNoon', '午饭吃了吗 🍚');
    else if (hour < 18) line = PS.t('greetAfternoon', '下午好，喝口水吧');
    else if (hour < 23) line = PS.t('greetEvening', '晚上好 🌙');
    else line = PS.t('greetLate', '这么晚还在忙？');

    if (sleeping) return;
    setTimeout(() => {
      if (taps === 0 && !sleeping && !agentAround()) {
        if (affection >= 30 && Math.random() < 0.5) line = PS.t('greetBack', '又见面啦 ♥');
        say(line, { duration: 2400 });
      }
    }, 600);
  }

  setInterval(() => {
    if (document.hidden || sleeping) return;
    if (careShown) return;
    if (Date.now() - sessionStart < 50 * 60 * 1000) return;
    careShown = true;
    setMood('happy', 3200);
    pulse('anim-stretch', 1800);
    localSay(CARE_LINES, { duration: 3600 });
  }, 60 * 1000);

  document.addEventListener('visibilitychange', () => {
    document.documentElement.classList.toggle('page-hidden', document.hidden);
    if (document.hidden) {
      hiddenAt = Date.now();
      clearTimeout(idleTimer);
      return;
    }
    if (hiddenAt && Date.now() - hiddenAt > 5 * 60 * 1000) {
      sessionStart = Date.now();
      careShown = false;
    }
    hiddenAt = 0;
    scheduleIdle();
    if (!sleeping) scheduleSleep();
  });

  // ── 启动 ─────────────────────────────────────────────────────
  renderSound();
  setMood('idle');
  updatePresenceUI();
  greet();
  scheduleIdle();
  scheduleSleep();
  emit('pet:ready', {
    version: VERSION,
    mood,
    muted,
    affection,
    moods: MOODS.slice(),
    features: ['mood', 'task', 'animate', 'presence', 'affection'],
  });
})();
</script>
</body>
</html>
