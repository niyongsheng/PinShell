<title>股票看板</title>
<meta name="description" content="沪深指数与自选行情，含日内走势曲线，东方财富数据，交易时段自动刷新，支持编辑自选。">
<meta name="pinshell:size" content="320x356">
<meta name="pinshell:position" content="right">
<meta name="pinshell:order" content="10">
<meta name="pinshell:opacity" content="0.98">

<link rel="stylesheet" href="design-tokens.css">
<style>
  :root {
    color-scheme: light dark;

    /* 深色（默认）：石墨行情板 */
    --ink: #f5f5f7;
    --muted: #a1a1a6;
    --dim: rgba(255, 255, 255, .38);
    --hairline: rgba(255, 255, 255, .09);
    --surface: #272729;
    --up: #ff6b63;
    --down: #32d74b;
    --flat: #a1a1a6;
    --live: #64d2c3;
    --warn: #ffb86b;
    --board-top: #2b2b2d;
    --board-mid: #252527;
    --board-bottom: #202022;
    --board-highlight: rgba(255, 255, 255, .05);
    --board-border: rgba(255, 255, 255, .085);
    --board-inset: rgba(255, 255, 255, .06);
    --hover-bg: rgba(255, 255, 255, .07);
    --hover-row: rgba(255, 255, 255, .035);
    --input-bg: rgba(0, 0, 0, .2);
    --accent: #2997ff;
    --accent-ink: #8ec5ff;
    --accent-soft: rgba(41, 151, 255, .16);
    --focus-border: rgba(41, 151, 255, .55);
    --focus-ring: rgba(41, 151, 255, .12);
    --live-ink: #b9eee7;
    --live-border: rgba(100, 210, 195, .28);
    --live-glow: rgba(100, 210, 195, .7);
    --warn-ink: #f0d3a8;
    --warn-border: rgba(255, 184, 107, .3);
    --spark-base: rgba(255, 255, 255, .16);
    --flat-soft: rgba(161, 161, 166, .1);
    --up-soft: rgba(255, 107, 99, .1);
    --down-soft: rgba(50, 215, 75, .1);
    --add-border: rgba(255, 255, 255, .12);
    --add-bg: rgba(255, 255, 255, .06);
    --add-hover: rgba(255, 255, 255, .12);
  }

  /* 浅色：珍珠白行情板，涨跌色加深以保对比度 */
  @media (prefers-color-scheme: light) {
    :root {
      --ink: var(--ps-ink);
      --muted: #6e6e73;
      --dim: rgba(29, 29, 31, .42);
      --hairline: rgba(0, 0, 0, .09);
      --surface: #f5f5f7;
      --up: #d13b33;
      --down: #1e8f45;
      --flat: #6e6e73;
      --live: #0f8f82;
      --warn: #b25000;
      --board-top: #ffffff;
      --board-mid: #f7f7f9;
      --board-bottom: #f2f2f5;
      --board-highlight: rgba(255, 255, 255, .7);
      --board-border: rgba(0, 0, 0, .085);
      --board-inset: rgba(255, 255, 255, .9);
      --hover-bg: rgba(0, 0, 0, .05);
      --hover-row: rgba(0, 0, 0, .03);
      --input-bg: rgba(255, 255, 255, .75);
      --accent: var(--ps-primary);
      --accent-ink: var(--ps-primary);
      --accent-soft: rgba(0, 102, 204, .12);
      --focus-border: rgba(0, 102, 204, .5);
      --focus-ring: rgba(0, 102, 204, .12);
      --live-ink: #0f6e65;
      --live-border: rgba(15, 143, 130, .3);
      --live-glow: rgba(15, 143, 130, .35);
      --warn-ink: #8a4a00;
      --warn-border: rgba(178, 80, 0, .28);
      --spark-base: rgba(0, 0, 0, .14);
      --flat-soft: rgba(110, 110, 115, .1);
      --up-soft: rgba(209, 59, 51, .1);
      --down-soft: rgba(30, 143, 69, .1);
      --add-border: rgba(0, 0, 0, .12);
      --add-bg: rgba(0, 0, 0, .05);
      --add-hover: rgba(0, 0, 0, .08);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; }
  .board {
    position: relative;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    padding: 12px 14px 10px;
    border-radius: 18px;
    overflow: hidden;
    color: var(--ink);
    background:
      radial-gradient(120% 70% at 50% -20%, var(--board-highlight), transparent 60%),
      linear-gradient(165deg, var(--board-top) 0%, var(--board-mid) 55%, var(--board-bottom) 100%);
    border: 1px solid var(--board-border);
    box-shadow: inset 0 1px 0 var(--board-inset);
    font: 12px -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ---------- 顶部 ---------- */
  .head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    height: 22px;
    margin-bottom: 6px;
  }
  .head-left { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .title {
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: .02em;
    white-space: nowrap;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    height: 16px;
    padding: 0 6px;
    border: 1px solid var(--hairline);
    border-radius: 999px;
    font-size: 8.5px;
    color: var(--muted);
    white-space: nowrap;
  }
  .status-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--dim);
    flex: 0 0 auto;
  }
  .status.live { color: var(--live-ink); border-color: var(--live-border); }
  .status.live .status-dot { background: var(--live); box-shadow: 0 0 6px var(--live-glow); }
  .status.auction { color: var(--warn-ink); border-color: var(--warn-border); }
  .status.auction .status-dot { background: var(--warn); animation: blink 1.2s ease-in-out infinite; }

  .head-actions {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .icon-btn {
    flex: 0 0 auto;
    width: 20px; height: 20px;
    padding: 0;
    display: grid;
    place-items: center;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: color .15s, background .15s;
  }
  .icon-btn:hover { color: var(--ink); background: var(--hover-bg); }
  .icon-btn:active { transform: scale(.94); }
  .icon-btn:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
  .icon-btn svg { width: 12px; height: 12px; display: block; }
  .icon-btn.loading svg { animation: spin .9s linear infinite; }
  .icon-btn .ico-done { display: none; }
  .board.editing .edit-btn { color: var(--accent-ink); background: var(--accent-soft); }
  .board.editing .edit-btn .ico-edit { display: none; }
  .board.editing .edit-btn .ico-done { display: block; }

  /* ---------- 分组与行 ---------- */
  .group-label {
    height: 12px;
    margin: 0 0 4px;
    font-size: 8.5px;
    letter-spacing: .1em;
    color: var(--dim);
    line-height: 12px;
  }
  .rows { display: flex; flex-direction: column; }
  .row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 64px 54px 44px;
    align-items: center;
    column-gap: 8px;
    height: 28px;
    padding: 0 2px;
    border-radius: 6px;
    cursor: default;
  }
  .row.watch { height: 26px; }
  .row:hover { background: var(--hover-row); }
  .name {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--ink);
  }
  .name small {
    display: block;
    margin-top: 1px;
    font-size: 8.5px;
    font-weight: 400;
    line-height: 1;
    color: var(--dim);
    letter-spacing: .04em;
  }
  .price {
    font-size: 11.5px;
    font-variant-numeric: tabular-nums;
    text-align: right;
    color: var(--ink);
    white-space: nowrap;
  }
  .pct {
    font-size: 10.5px;
    font-variant-numeric: tabular-nums;
    text-align: right;
    color: var(--flat);
    white-space: nowrap;
  }
  .row.up .pct { color: var(--up); }
  .row.down .pct { color: var(--down); }

  /* 日内走势：2px 曲线 + 10% 面积 + 昨收基准线 */
  .spark {
    display: block;
    width: 44px;
    height: 18px;
    overflow: visible;
    opacity: 0;
    transition: opacity .25s ease;
  }
  .spark.ready { opacity: 1; }
  .spark-line {
    fill: none;
    stroke: var(--flat);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .spark-area { fill: var(--flat-soft); }
  .spark-base { stroke: var(--spark-base); stroke-width: 1; }
  .row.up .spark-line { stroke: var(--up); }
  .row.up .spark-area { fill: var(--up-soft); }
  .row.down .spark-line { stroke: var(--down); }
  .row.down .spark-area { fill: var(--down-soft); }

  /* ---------- 编辑自选 ---------- */
  .remove { display: none; }
  .board.editing .row.watch { grid-template-columns: minmax(0, 1fr) 54px 44px 18px; }
  .board.editing .row.watch .spark { display: none; }
  .board.editing .row.watch .remove { display: grid; }
  .remove {
    width: 18px; height: 18px;
    padding: 0;
    place-items: center;
    border: none;
    border-radius: 5px;
    background: transparent;
    color: var(--dim);
    cursor: pointer;
    transition: color .15s, background .15s;
  }
  .remove:hover { color: var(--ink); background: var(--hover-bg); }
  .remove:active { transform: scale(.92); }
  .remove:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
  .remove svg { width: 10px; height: 10px; display: block; pointer-events: none; }

  .group-label .count { margin-left: 5px; letter-spacing: 0; }

  .add-row { display: flex; gap: 5px; margin-top: 6px; }
  .add-row[hidden] { display: none; }
  .add-input {
    flex: 1 1 auto;
    min-width: 0;
    height: 24px;
    padding: 0 7px;
    border: 1px solid var(--hairline);
    border-radius: 6px;
    background: var(--input-bg);
    color: var(--ink);
    font: inherit;
    font-size: 10.5px;
    outline: none;
    user-select: text;
    -webkit-user-select: text;
  }
  .add-input::placeholder { color: var(--dim); }
  .add-input:focus {
    border-color: var(--focus-border);
    box-shadow: 0 0 0 2px var(--focus-ring);
  }
  .add-input:disabled { opacity: .55; }
  .add-submit {
    flex: 0 0 auto;
    width: 24px; height: 24px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 1px solid var(--add-border);
    border-radius: 6px;
    background: var(--add-bg);
    color: var(--ink);
    font: 15px/1 -apple-system, BlinkMacSystemFont, sans-serif;
    cursor: pointer;
  }
  .add-submit:hover { background: var(--add-hover); }
  .add-submit:active { transform: scale(.94); }
  .add-submit:disabled { opacity: .4; cursor: default; }
  .add-hint {
    margin-top: 4px;
    font-size: 8.5px;
    line-height: 1.4;
    color: var(--warn);
  }
  .add-hint[hidden] { display: none; }
  .add-hint.ok { color: var(--live); }
  .add-hint.info { color: var(--muted); }

  .rule {
    height: 1px;
    margin: 8px 0;
    background: var(--hairline);
  }

  /* ---------- 底部 ---------- */
  .foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: auto;
    height: 12px;
    font-size: 8.5px;
    color: var(--dim);
    white-space: nowrap;
    overflow: hidden;
  }
  .foot-note {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .foot-note.warn { color: var(--warn); }
  .foot-time {
    flex: 0 0 auto;
    font-variant-numeric: tabular-nums;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) {
    .icon-btn.loading svg, .status.auction .status-dot { animation: none; }
    .spark, .icon-btn, .remove { transition: none; }
  }
</style>

<body>
<div class="board ps-dim-surface" id="board">
  <header class="head">
    <div class="head-left">
      <span class="title">股票看板</span>
      <span class="status" id="status"><i class="status-dot"></i><span id="statusText">—</span></span>
    </div>
    <div class="head-actions">
      <button type="button" class="icon-btn edit-btn" id="editBtn" title="编辑自选" aria-label="编辑自选" aria-pressed="false">
        <svg class="ico-edit" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11.2 2.7l2.1 2.1L6 12.1l-2.8.8.8-2.8 7.2-7.4z"></path>
          <path d="M9.9 4l2.1 2.1"></path>
        </svg>
        <svg class="ico-done" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 8.4l3.2 3.2L13 5"></path>
        </svg>
      </button>
      <button type="button" class="icon-btn" id="refreshBtn" title="刷新行情" aria-label="刷新行情">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M13.1 6.5A5.4 5.4 0 1 0 13 10"></path>
          <path d="M13.4 2.8v3.9H9.5"></path>
        </svg>
      </button>
    </div>
  </header>

  <section>
    <div class="group-label">指数</div>
    <div class="rows" id="indexList"></div>
  </section>

  <div class="rule"></div>

  <section>
    <div class="group-label">自选<span class="count" id="watchCount"></span></div>
    <div class="rows" id="watchList"></div>
    <form class="add-row" id="addForm" hidden>
      <input class="add-input" id="addInput" type="text" inputmode="search" autocomplete="off"
             spellcheck="false" placeholder="代码或名称，如 600519" aria-label="添加自选股">
      <button type="submit" class="add-submit" id="addBtn" title="添加自选" aria-label="添加自选">+</button>
    </form>
    <div class="add-hint" id="addHint" hidden></div>
  </section>

  <footer class="foot">
    <span class="foot-note" id="footNote">加载中…</span>
    <span class="foot-time" id="footTime"></span>
  </footer>
</div>
<script>
(function () {
  'use strict';

  // ── 配置：指数固定；自选可在面板内点 ✎ 编辑，下面只是默认值 ──────
  // secid 规则：沪市 1.代码，深市 / 北交所 0.代码（指数与个股相同）。
  const CONFIG = {
    indices: [
      { secid: '1.000001', label: '上证指数' },
      { secid: '0.399001', label: '深证成指' },
      { secid: '0.399006', label: '创业板指' }
    ],
    defaultWatchlist: [
      { secid: '1.688825', label: '长鑫科技' },
      { secid: '0.300750', label: '宁德时代' },
      { secid: '0.002594', label: '比亚迪' },
      { secid: '1.688981', label: '中芯国际' },
      { secid: '1.601318', label: '中国平安' },
      { secid: '0.300059', label: '东方财富' }
    ],
    maxWatchlist: 10,
    refreshTradingMs: 20000,
    refreshIdleMs: 60000,
    sparkTradingMs: 60000,
    sparkIdleMs: 300000,
    fetchTimeoutMs: 10000
  };
  // ────────────────────────────────────────────────────────────────

  const API = 'https://push2.eastmoney.com/api/qt/ulist.np/get';
  const TREND_API = 'https://push2his.eastmoney.com/api/qt/stock/trends2/get';
  const FIELDS = 'f2,f3,f4,f12,f13,f14,f15,f16,f17,f18';
  const SEARCH_API = 'https://searchapi.eastmoney.com/api/suggest/get';
  const SEARCH_TOKEN = 'D43BF722C8E33BDC906FB84D85E326E8';
  const CACHE_KEY = 'pinshell.stockBoard.v2';
  const WATCHLIST_KEY = 'pinshell.stockBoard.watchlist.v1';
  const FOOT_NORMAL = '交易时段：行情 20 秒 · 走势 60 秒 · 仅供参考';
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const SPARK_W = 44;
  const SPARK_H = 18;
  const SPARK_PAD = 1.5;
  const SPARK_MAX_POINTS = 48;

  const watchlist = loadWatchlist();

  const el = {
    board: document.getElementById('board'),
    status: document.getElementById('status'),
    statusText: document.getElementById('statusText'),
    editBtn: document.getElementById('editBtn'),
    refreshBtn: document.getElementById('refreshBtn'),
    indexList: document.getElementById('indexList'),
    watchList: document.getElementById('watchList'),
    watchCount: document.getElementById('watchCount'),
    addForm: document.getElementById('addForm'),
    addInput: document.getElementById('addInput'),
    addBtn: document.getElementById('addBtn'),
    addHint: document.getElementById('addHint'),
    footNote: document.getElementById('footNote'),
    footTime: document.getElementById('footTime')
  };

  const state = {
    quotes: Object.create(null),
    sparks: Object.create(null),
    rows: Object.create(null),
    watchRows: Object.create(null),
    updatedAt: 0,
    sparksUpdatedAt: 0,
    loading: false,
    sparksLoading: false,
    failures: 0,
    editing: false,
    addBusy: false,
    timer: null,
    sparkTimer: null,
    hintTimer: null,
    fitFrame: 0
  };

  const numberFormat = new Intl.NumberFormat('zh-CN', {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
  const clockFormat = new Intl.DateTimeFormat('zh-CN', {
    timeZone: 'Asia/Shanghai',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    hourCycle: 'h23'
  });

  // ---------- 时间与市场状态 ----------

  function shanghaiClock() {
    const parts = new Intl.DateTimeFormat('en-US', {
      timeZone: 'Asia/Shanghai',
      weekday: 'short',
      hour: '2-digit',
      minute: '2-digit',
      hourCycle: 'h23'
    }).formatToParts(new Date());
    const map = {};
    parts.forEach(function (part) { map[part.type] = part.value; });
    return {
      weekday: map.weekday,
      minutes: Number(map.hour) * 60 + Number(map.minute)
    };
  }

  function marketStatus() {
    const clock = shanghaiClock();
    if (clock.weekday === 'Sat' || clock.weekday === 'Sun') {
      return { text: '休市', live: false, auction: false };
    }
    const m = clock.minutes;
    if (m < 555) return { text: '未开盘', live: false, auction: false };
    if (m < 570) return { text: '集合竞价', live: true, auction: true };
    if (m < 690) return { text: '交易中', live: true, auction: false };
    if (m < 780) return { text: '午间休市', live: false, auction: false };
    if (m < 900) return { text: '交易中', live: true, auction: false };
    return { text: '已收盘', live: false, auction: false };
  }

  function updateStatus() {
    const status = marketStatus();
    el.statusText.textContent = status.text;
    el.status.classList.toggle('live', status.live && !status.auction);
    el.status.classList.toggle('auction', status.auction);
    return status;
  }

  function formatTime(timestamp) {
    if (!timestamp) return '';
    return clockFormat.format(new Date(timestamp));
  }

  // ---------- 网络 ----------

  function withTimeout(promise, ms) {
    return new Promise(function (resolve, reject) {
      const timer = setTimeout(function () {
        reject(new Error('请求超时'));
      }, ms);
      promise.then(function (value) {
        clearTimeout(timer);
        resolve(value);
      }, function (error) {
        clearTimeout(timer);
        reject(error);
      });
    });
  }

  function delay(ms) {
    return new Promise(function (resolve) { setTimeout(resolve, ms); });
  }

  function num(value) {
    const parsed = Number(value);
    return Number.isFinite(parsed) ? parsed : null;
  }

  function requestURL() {
    const secids = CONFIG.indices.concat(watchlist)
      .map(function (item) { return item.secid; })
      .join(',');
    return API + '?fltt=2&invt=2&secids=' + encodeURIComponent(secids)
      + '&fields=' + FIELDS + '&_=' + Date.now();
  }

  function trendURL(secid) {
    return TREND_API + '?secid=' + encodeURIComponent(secid)
      + '&ndays=1&iscr=0&fields1=f1,f2,f3,f4,f5&fields2=f51,f53';
  }

  function normalizeQuote(row) {
    if (!row || typeof row !== 'object') return null;
    const price = num(row.f2);
    if (price == null) return null;
    return {
      name: typeof row.f14 === 'string' ? row.f14 : '',
      price: price,
      pct: num(row.f3),
      change: num(row.f4),
      high: num(row.f15),
      low: num(row.f16),
      open: num(row.f17),
      prevClose: num(row.f18)
    };
  }

  function parseTrends(payload) {
    const rows = payload && payload.data && Array.isArray(payload.data.trends)
      ? payload.data.trends
      : [];
    const values = [];
    rows.forEach(function (row) {
      const parts = String(row).split(',');
      const value = num(parts[1]);
      if (value != null) values.push(value);
    });
    return samplePoints(values);
  }

  function samplePoints(values) {
    if (values.length <= SPARK_MAX_POINTS) return values.slice();
    const out = [];
    for (let i = 0; i < SPARK_MAX_POINTS; i += 1) {
      out.push(values[Math.round(i * (values.length - 1) / (SPARK_MAX_POINTS - 1))]);
    }
    return out;
  }

  async function fetchQuotes() {
    if (state.loading) return;
    if (!window.pinshell || typeof pinshell.fetch !== 'function') {
      showError('PinShell 网络桥不可用');
      scheduleNext();
      return;
    }
    state.loading = true;
    el.refreshBtn.classList.add('loading');
    el.refreshBtn.disabled = true;

    try {
      const raw = await withTimeout(
        pinshell.fetch(requestURL(), { headers: { Accept: 'application/json' } }),
        CONFIG.fetchTimeoutMs
      );
      const payload = typeof raw === 'string' ? JSON.parse(raw) : raw;
      const diff = payload && payload.data && Array.isArray(payload.data.diff)
        ? payload.data.diff
        : [];
      const fresh = Object.create(null);
      diff.forEach(function (row) {
        const quote = normalizeQuote(row);
        if (quote) fresh[String(row.f13) + '.' + String(row.f12)] = quote;
      });
      if (!Object.keys(fresh).length) throw new Error('行情为空');
      state.quotes = Object.assign(Object.create(null), state.quotes, fresh);
      state.updatedAt = Date.now();
      state.failures = 0;
      saveCache();
      renderAll();
      clearError();
    } catch (error) {
      state.failures += 1;
      logError(error);
      showError(state.updatedAt ? '刷新失败 · 显示上次数据' : '行情连接失败，稍后重试');
    } finally {
      state.loading = false;
      el.refreshBtn.classList.remove('loading');
      el.refreshBtn.disabled = false;
      updateStatus();
      scheduleNext();
    }
  }

  async function fetchSparks(force) {
    if (state.sparksLoading) return;
    if (!window.pinshell || typeof pinshell.fetch !== 'function') return;
    if (!force && state.sparksUpdatedAt
        && Date.now() - state.sparksUpdatedAt < 15000) return;

    state.sparksLoading = true;
    const items = CONFIG.indices.map(function (item) {
      return { item: item, isWatch: false };
    }).concat(watchlist.map(function (item) {
      return { item: item, isWatch: true };
    }));
    let updated = false;

    for (let i = 0; i < items.length; i += 1) {
      const entry = items[i];
      try {
        const raw = await withTimeout(
          pinshell.fetch(trendURL(entry.item.secid), { headers: { Accept: 'application/json' } }),
          CONFIG.fetchTimeoutMs
        );
        const points = parseTrends(typeof raw === 'string' ? JSON.parse(raw) : raw);
        if (points.length >= 2) {
          state.sparks[entry.item.secid] = points;
          updateSpark(entry.item, entry.isWatch);
          updated = true;
        }
      } catch (error) {
        // 单个标的失败保留上一次曲线，不影响其他行。
      }
      if (i < items.length - 1) await delay(120);
    }

    if (updated) {
      state.sparksUpdatedAt = Date.now();
      saveCache();
    }
    state.sparksLoading = false;
    scheduleSparks();
  }

  async function fetchSparkFor(item) {
    if (!window.pinshell || typeof pinshell.fetch !== 'function') return;
    try {
      const raw = await withTimeout(
        pinshell.fetch(trendURL(item.secid), { headers: { Accept: 'application/json' } }),
        CONFIG.fetchTimeoutMs
      );
      const points = parseTrends(typeof raw === 'string' ? JSON.parse(raw) : raw);
      if (points.length >= 2) {
        state.sparks[item.secid] = points;
        updateSpark(item, true);
        saveCache();
      }
    } catch (error) {
      // 新加自选的曲线失败时保持占位，等待下一轮刷新。
    }
  }

  function logError(error) {
    try {
      if (window.pinshell && typeof pinshell.log === 'function') {
        pinshell.log('stock-board: ' + (error && error.message ? error.message : String(error)));
      }
    } catch (e) {}
  }

  function scheduleNext() {
    clearTimeout(state.timer);
    const status = marketStatus();
    const base = status.live ? CONFIG.refreshTradingMs : CONFIG.refreshIdleMs;
    const backoff = state.failures >= 3 ? 3 : 1;
    state.timer = setTimeout(fetchQuotes, base * backoff);
  }

  function scheduleSparks() {
    clearTimeout(state.sparkTimer);
    const base = marketStatus().live ? CONFIG.sparkTradingMs : CONFIG.sparkIdleMs;
    const wait = state.sparksUpdatedAt ? base : 30000;
    state.sparkTimer = setTimeout(function () { fetchSparks(false); }, wait);
  }

  // ---------- 缓存 ----------

  function saveCache() {
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({
        v: 2,
        t: state.updatedAt,
        st: state.sparksUpdatedAt,
        q: state.quotes,
        s: state.sparks
      }));
    } catch (e) {}
  }

  function loadCache() {
    try {
      const data = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
      if (!data || data.v !== 2 || !data.q || typeof data.q !== 'object') return false;
      const quotes = Object.create(null);
      Object.keys(data.q).forEach(function (key) {
        const item = data.q[key];
        if (item && typeof item.price === 'number') quotes[key] = item;
      });
      if (!Object.keys(quotes).length) return false;
      state.quotes = quotes;

      if (data.s && typeof data.s === 'object') {
        Object.keys(data.s).forEach(function (key) {
          if (!Array.isArray(data.s[key])) return;
          const clean = data.s[key].map(num).filter(function (value) { return value != null; });
          if (clean.length >= 2) state.sparks[key] = clean;
        });
      }
      state.updatedAt = typeof data.t === 'number' ? data.t : 0;
      state.sparksUpdatedAt = typeof data.st === 'number' ? data.st : 0;
      return true;
    } catch (e) {
      return false;
    }
  }

  // ---------- 自选编辑 ----------

  function loadWatchlist() {
    const fallback = CONFIG.defaultWatchlist.map(function (item) {
      return { secid: item.secid, label: item.label };
    });
    try {
      const stored = localStorage.getItem(WATCHLIST_KEY);
      if (stored == null) return fallback;
      const data = JSON.parse(stored);
      if (!Array.isArray(data)) return fallback;
      const seen = Object.create(null);
      const list = [];
      data.forEach(function (item) {
        if (!item || typeof item.secid !== 'string') return;
        if (!/^[01]\.\w+$/.test(item.secid) || seen[item.secid]) return;
        seen[item.secid] = true;
        const label = typeof item.label === 'string' && item.label
          ? item.label
          : (item.secid.split('.')[1] || item.secid);
        list.push({ secid: item.secid, label: label });
      });
      if (data.length && !list.length) return fallback;
      return list.slice(0, CONFIG.maxWatchlist);
    } catch (e) {
      return fallback;
    }
  }

  function saveWatchlist() {
    try {
      localStorage.setItem(WATCHLIST_KEY, JSON.stringify(watchlist));
    } catch (e) {}
  }

  function updateWatchCount() {
    el.watchCount.textContent = watchlist.length + ' 只';
  }

  function scheduleFit() {
    cancelAnimationFrame(state.fitFrame);
    state.fitFrame = requestAnimationFrame(fitHeight);
  }

  function fitHeight() {
    if (!window.pinshell || typeof pinshell.setSize !== 'function') return;
    const board = el.board;
    const previous = board.style.minHeight;
    board.style.minHeight = '0';
    const natural = Math.ceil(board.getBoundingClientRect().height);
    board.style.minHeight = previous;
    if (natural > 0 && Math.abs(natural - window.innerHeight) > 1) {
      pinshell.setSize(Math.round(window.innerWidth), natural);
    }
  }

  function hideAddHint() {
    const wasVisible = !el.addHint.hidden;
    clearTimeout(state.hintTimer);
    state.hintTimer = null;
    el.addHint.hidden = true;
    el.addHint.textContent = '';
    el.addHint.classList.remove('ok', 'info');
    if (wasVisible) scheduleFit();
  }

  function showAddHint(message, tone) {
    clearTimeout(state.hintTimer);
    el.addHint.textContent = message;
    el.addHint.classList.toggle('ok', tone === 'ok');
    el.addHint.classList.toggle('info', tone === 'info');
    el.addHint.hidden = false;
    scheduleFit();
    if (tone === 'ok') {
      state.hintTimer = setTimeout(hideAddHint, 2200);
    }
  }

  function setEditing(enabled) {
    if (state.editing === enabled) return;
    state.editing = enabled;
    el.board.classList.toggle('editing', enabled);
    el.editBtn.setAttribute('aria-pressed', enabled ? 'true' : 'false');
    el.editBtn.title = enabled ? '完成编辑' : '编辑自选';
    el.editBtn.setAttribute('aria-label', el.editBtn.title);
    el.addForm.hidden = !enabled;
    if (enabled) {
      el.addInput.focus();
    } else {
      el.addInput.value = '';
      el.addInput.blur();
      hideAddHint();
    }
    scheduleFit();
  }

  function rebuildWatchRows() {
    el.watchList.textContent = '';
    state.watchRows = Object.create(null);
    buildRows(el.watchList, watchlist, true);
    updateWatchCount();
    renderAll();
    scheduleFit();
  }

  function removeWatch(secid) {
    const index = watchlist.findIndex(function (item) { return item.secid === secid; });
    if (index < 0) return;
    const removed = watchlist.splice(index, 1)[0];
    delete state.watchRows[secid];
    delete state.quotes[secid];
    delete state.sparks[secid];
    saveWatchlist();
    saveCache();
    rebuildWatchRows();
    if (state.editing) showAddHint('已移除 · ' + removed.label, 'ok');
  }

  async function searchStocks(text) {
    const url = SEARCH_API + '?input=' + encodeURIComponent(text)
      + '&type=14&token=' + SEARCH_TOKEN + '&count=10&_=' + Date.now();
    const raw = await withTimeout(
      pinshell.fetch(url, { headers: { Accept: 'application/json' } }),
      CONFIG.fetchTimeoutMs
    );
    const payload = typeof raw === 'string' ? JSON.parse(raw) : raw;
    const table = payload && payload.QuotationCodeTable;
    const data = table && Array.isArray(table.Data) ? table.Data : [];
    return data.filter(function (item) {
      if (!item || typeof item.QuoteID !== 'string' || !/^[01]\.\w+$/.test(item.QuoteID)) {
        return false;
      }
      return item.Classify === 'AStock'
        || item.SecurityTypeName === '科创板'
        || item.SecurityTypeName === '创业板'
        || item.SecurityTypeName === '京A';
    });
  }

  function pickCandidate(list, text) {
    for (let i = 0; i < list.length; i += 1) {
      const item = list[i];
      if (item.Code === text || item.UnifiedCode === text || item.Name === text) {
        return item;
      }
    }
    return list[0];
  }

  async function fetchSingleQuote(secid) {
    const raw = await withTimeout(
      pinshell.fetch(API + '?fltt=2&invt=2&secids=' + encodeURIComponent(secid)
        + '&fields=' + FIELDS + '&_=' + Date.now(),
        { headers: { Accept: 'application/json' } }),
      CONFIG.fetchTimeoutMs
    );
    const payload = typeof raw === 'string' ? JSON.parse(raw) : raw;
    const diff = payload && payload.data && Array.isArray(payload.data.diff)
      ? payload.data.diff
      : [];
    for (let i = 0; i < diff.length; i += 1) {
      const row = diff[i];
      const quote = normalizeQuote(row);
      if (quote && String(row.f13) + '.' + String(row.f12) === secid) return quote;
    }
    return null;
  }

  async function resolveWatch(text) {
    if (!window.pinshell || typeof pinshell.fetch !== 'function') {
      throw new Error('PinShell 网络桥不可用');
    }
    let secid = null;
    let candidate = null;
    if (/^[01]\.\w+$/.test(text)) {
      secid = text;
    } else {
      const list = await searchStocks(text);
      if (!list.length) throw new Error('未找到「' + text + '」');
      candidate = pickCandidate(list, text);
      secid = candidate.QuoteID;
    }
    if (watchlist.some(function (item) { return item.secid === secid; })) {
      throw new Error('已在自选中');
    }
    if (watchlist.length >= CONFIG.maxWatchlist) {
      throw new Error('自选最多 ' + CONFIG.maxWatchlist + ' 只');
    }
    const quote = await fetchSingleQuote(secid);
    if (!quote) throw new Error('未获取到行情，请检查代码');
    return {
      secid: secid,
      label: quote.name || (candidate && candidate.Name) || secid.split('.')[1],
      quote: quote
    };
  }

  async function addWatch(raw) {
    if (state.addBusy) return;
    const text = String(raw || '').trim().replace(/^(sh|sz|bj)\.?/i, '');
    if (!text) {
      showAddHint('请输入代码或名称');
      return;
    }
    state.addBusy = true;
    el.addBtn.disabled = true;
    el.addInput.disabled = true;
    showAddHint('正在查找…', 'info');
    try {
      const resolved = await resolveWatch(text);
      watchlist.push({ secid: resolved.secid, label: resolved.label });
      state.quotes[resolved.secid] = resolved.quote;
      saveWatchlist();
      saveCache();
      rebuildWatchRows();
      el.addInput.value = '';
      showAddHint('已添加 · ' + resolved.label, 'ok');
      fetchQuotes();
      fetchSparkFor({ secid: resolved.secid, label: resolved.label });
    } catch (error) {
      showAddHint(error && error.message ? error.message : '添加失败');
    } finally {
      state.addBusy = false;
      el.addBtn.disabled = false;
      el.addInput.disabled = false;
      if (state.editing) el.addInput.focus();
    }
  }

  // ---------- 渲染 ----------

  function formatPrice(value) {
    return value == null ? '—' : numberFormat.format(value);
  }

  function formatPercent(value) {
    if (value == null) return '—';
    const sign = value > 0 ? '+' : value < 0 ? '-' : '';
    return sign + Math.abs(value).toFixed(2) + '%';
  }

  function directionOf(quote) {
    if (!quote || quote.pct == null) return 'flat';
    if (quote.pct > 0) return 'up';
    if (quote.pct < 0) return 'down';
    return 'flat';
  }

  function buildRows(container, items, isWatch) {
    const store = isWatch ? state.watchRows : state.rows;
    items.forEach(function (item) {
      const row = document.createElement('div');
      row.className = 'row flat' + (isWatch ? ' watch' : '');
      row.dataset.secid = item.secid;

      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = item.label;
      if (isWatch) {
        const code = document.createElement('small');
        code.textContent = item.secid.split('.')[1] || item.secid;
        name.appendChild(code);
      }

      const price = document.createElement('span');
      price.className = 'price';
      price.textContent = '—';

      const pct = document.createElement('span');
      pct.className = 'pct';
      pct.textContent = '—';

      const spark = document.createElementNS(SVG_NS, 'svg');
      spark.setAttribute('class', 'spark');
      spark.setAttribute('viewBox', '0 0 ' + SPARK_W + ' ' + SPARK_H);
      spark.setAttribute('aria-hidden', 'true');

      const sparkArea = document.createElementNS(SVG_NS, 'path');
      sparkArea.setAttribute('class', 'spark-area');
      const sparkBase = document.createElementNS(SVG_NS, 'line');
      sparkBase.setAttribute('class', 'spark-base');
      sparkBase.setAttribute('x1', String(SPARK_PAD));
      sparkBase.setAttribute('x2', String(SPARK_W - SPARK_PAD));
      const sparkLine = document.createElementNS(SVG_NS, 'path');
      sparkLine.setAttribute('class', 'spark-line');

      spark.appendChild(sparkArea);
      spark.appendChild(sparkBase);
      spark.appendChild(sparkLine);

      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'remove';
      remove.title = '移除 ' + item.label;
      remove.setAttribute('aria-label', '移除 ' + item.label);
      remove.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor"'
        + ' stroke-width="2" stroke-linecap="round" aria-hidden="true">'
        + '<path d="M4 4l8 8M12 4l-8 8"></path></svg>';
      remove.addEventListener('click', function (event) {
        event.stopPropagation();
        removeWatch(item.secid);
      });

      row.appendChild(name);
      row.appendChild(price);
      row.appendChild(pct);
      row.appendChild(spark);
      row.appendChild(remove);
      container.appendChild(row);

      store[item.secid] = {
        row: row,
        price: price,
        pct: pct,
        spark: spark,
        sparkArea: sparkArea,
        sparkBase: sparkBase,
        sparkLine: sparkLine
      };
    });
  }

  function sparkGeometry(points, prevClose) {
    if (!Array.isArray(points) || points.length < 2) return null;
    let min = Infinity;
    let max = -Infinity;
    points.forEach(function (value) {
      if (value < min) min = value;
      if (value > max) max = value;
    });
    if (prevClose != null) {
      min = Math.min(min, prevClose);
      max = Math.max(max, prevClose);
    }
    if (!(max > min)) {
      const pad = Math.max(Math.abs(max) * 0.001, 0.01);
      min -= pad;
      max += pad;
    }
    const breathing = (max - min) * 0.06;
    min -= breathing;
    max += breathing;

    const innerW = SPARK_W - SPARK_PAD * 2;
    const innerH = SPARK_H - SPARK_PAD * 2;
    function x(index) { return SPARK_PAD + (index / (points.length - 1)) * innerW; }
    function y(value) { return SPARK_H - SPARK_PAD - ((value - min) / (max - min)) * innerH; }

    let line = '';
    points.forEach(function (value, index) {
      line += (index ? 'L' : 'M') + x(index).toFixed(2) + ' ' + y(value).toFixed(2);
    });
    const area = line
      + 'L' + (SPARK_W - SPARK_PAD).toFixed(2) + ' ' + SPARK_H
      + 'L' + SPARK_PAD.toFixed(2) + ' ' + SPARK_H + 'Z';

    return {
      line: line,
      area: area,
      baseline: prevClose == null ? null : y(prevClose)
    };
  }

  function updateSpark(item, isWatch) {
    const parts = (isWatch ? state.watchRows : state.rows)[item.secid];
    if (!parts) return;
    const quote = state.quotes[item.secid];
    const geometry = sparkGeometry(state.sparks[item.secid],
                                   quote ? quote.prevClose : null);
    if (!geometry) {
      parts.spark.classList.remove('ready');
      return;
    }
    parts.sparkArea.setAttribute('d', geometry.area);
    parts.sparkLine.setAttribute('d', geometry.line);
    if (geometry.baseline == null) {
      parts.sparkBase.setAttribute('visibility', 'hidden');
    } else {
      parts.sparkBase.removeAttribute('visibility');
      parts.sparkBase.setAttribute('y1', geometry.baseline.toFixed(2));
      parts.sparkBase.setAttribute('y2', geometry.baseline.toFixed(2));
    }
    parts.spark.classList.add('ready');
  }

  function updateRow(item, isWatch) {
    const parts = (isWatch ? state.watchRows : state.rows)[item.secid];
    if (!parts) return;
    const quote = state.quotes[item.secid];
    const displayName = (quote && quote.name) || item.label;
    const code = item.secid.split('.')[1] || item.secid;

    if (isWatch) {
      parts.row.firstChild.firstChild.nodeValue = displayName;
    } else {
      parts.row.firstChild.textContent = displayName;
    }

    parts.row.classList.remove('up', 'down', 'flat');
    parts.row.classList.add(directionOf(quote));

    parts.price.textContent = quote ? formatPrice(quote.price) : '—';
    parts.pct.textContent = quote ? formatPercent(quote.pct) : '—';

    const title = quote
      ? displayName + ' ' + code
        + '\n最新 ' + formatPrice(quote.price)
        + '\n涨跌 ' + (quote.change == null ? '—' : numberFormat.format(quote.change))
        + ' (' + formatPercent(quote.pct) + ')'
        + '\n今开 ' + formatPrice(quote.open)
        + '\n最高 ' + formatPrice(quote.high) + '  最低 ' + formatPrice(quote.low)
        + '\n昨收 ' + formatPrice(quote.prevClose)
      : displayName + ' ' + code + '\n暂无数据';
    parts.row.title = title;
    parts.row.setAttribute('aria-label', title.replace(/\n/g, '，'));

    updateSpark(item, isWatch);
  }

  function renderAll() {
    CONFIG.indices.forEach(function (item) { updateRow(item, false); });
    watchlist.forEach(function (item) { updateRow(item, true); });
    if (state.updatedAt) {
      el.footTime.textContent = formatTime(state.updatedAt);
      if (!el.footNote.classList.contains('warn')) {
        el.footNote.textContent = FOOT_NORMAL;
      }
    }
  }

  function clearError() {
    el.footNote.classList.remove('warn');
    el.footNote.textContent = FOOT_NORMAL;
    if (state.updatedAt) el.footTime.textContent = formatTime(state.updatedAt);
  }

  function showError(message) {
    el.footNote.classList.add('warn');
    el.footNote.textContent = message;
    if (state.updatedAt) el.footTime.textContent = formatTime(state.updatedAt);
  }

  // ---------- 交互 ----------

  el.refreshBtn.addEventListener('click', function () {
    fetchQuotes();
    fetchSparks(true);
  });

  el.editBtn.addEventListener('click', function () {
    setEditing(!state.editing);
  });

  el.addForm.addEventListener('submit', function (event) {
    event.preventDefault();
    addWatch(el.addInput.value);
  });

  el.addInput.addEventListener('input', hideAddHint);

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && state.editing) {
      event.preventDefault();
      setEditing(false);
    }
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) return;
    if (!state.loading) fetchQuotes();
    fetchSparks(false);
  });

  // ---------- 启动 ----------

  function init() {
    buildRows(el.indexList, CONFIG.indices, false);
    buildRows(el.watchList, watchlist, true);
    updateWatchCount();
    updateStatus();
    if (loadCache()) {
      renderAll();
      el.footNote.textContent = '显示上次数据 · 正在刷新…';
    } else {
      renderAll();
    }
    scheduleFit();
    fetchQuotes();
    fetchSparks(false);
  }

  init();
})();
</script>
</body>
</html>
