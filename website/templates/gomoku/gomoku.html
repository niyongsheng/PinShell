<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<script type="application/json" id="pinshell:i18n">
{
  "default": "zh-Hans",
  "fallback": "en",
  "languages": {
    "zh-Hans": {
      "meta": {
        "name": "五子棋",
        "description": "你执黑先行，与内置算法对弈五子棋"
      }
    },
    "en": {
      "meta": {
        "name": "Gomoku",
        "description": "You play black and move first against a built-in opponent."
      }
    }
  }
}
</script>
<title>五子棋</title>
<meta name="description" content="你执黑先行，与内置算法对弈五子棋">
<meta name="pinshell:size" content="360x440">
<meta name="pinshell:position" content="bottom-right">
<meta name="pinshell:passthrough" content="false">
<meta name="pinshell:opacity" content="0.96">
<meta name="pinshell:radius" content="18">
<meta name="pinshell:order" content="9">
<style>
  :root {
    color-scheme: light dark;

    /* 浅色（默认）：暖色木纹棋盘 */
    --ink: #4a3418;
    --muted: #7a5c33;
    --accent: #d64538;
    --wood-top: #efd9ad;
    --wood-mid: #e3c28a;
    --wood-bottom: #d3ab6d;
    --wood-sheen: rgba(255, 247, 226, .65);
    --wood-sheen-clear: rgba(255, 247, 226, 0);
    --wood-grain: rgba(116, 78, 30, .045);
    --wood-border: rgba(255, 255, 255, .38);
    --wood-inset: rgba(255, 255, 255, .55);
    --wood-inner: rgba(120, 80, 30, .15);
    --button-border: rgba(116, 78, 30, .24);
    --button-bg: rgba(255, 255, 255, .34);
    --button-hover: rgba(255, 255, 255, .62);
    --button-ink: #5a3f1c;
    --board-bg-1: rgba(255, 250, 235, .5);
    --board-bg-2: rgba(255, 244, 216, .18);
    --board-inset-1: rgba(255, 255, 255, .45);
    --board-inset-2: rgba(120, 80, 30, .12);
    --grid-rgb: 74, 52, 24;
    --dot-idle: #111111;
    --dot-ring: rgba(0, 0, 0, .12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body {
    font: 13px -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", sans-serif;
    color: #fff;
    user-select: none;
    -webkit-user-select: none;
  }
  .panel {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding: 12px 12px 10px;
    border-radius: 18px;
    overflow: hidden;
    color: var(--ink);
    background:
      radial-gradient(120% 100% at 18% 0%, var(--wood-sheen), var(--wood-sheen-clear) 55%),
      repeating-linear-gradient(0deg, var(--wood-grain) 0 2px, transparent 2px 7px),
      linear-gradient(158deg, var(--wood-top) 0%, var(--wood-mid) 52%, var(--wood-bottom) 100%);
    box-shadow: inset 0 0 0 1px var(--wood-border), inset 0 1px 0 var(--wood-inset), inset 0 0 46px var(--wood-inner);
  }
  header { flex: 0 0 auto; height: 34px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 9px; }
  .logo { position: relative; width: 28px; height: 28px; flex: 0 0 auto; }
  .logo i { position: absolute; display: block; width: 16px; height: 16px; border-radius: 50%; }
  .logo .b { left: 0; top: 8px; background: radial-gradient(circle at 35% 30%, #6e6e6e, #141414 58%, #000); box-shadow: 0 1px 2px rgba(50,32,8,.45); }
  .logo .w { left: 11px; top: 4px; background: radial-gradient(circle at 35% 30%, #fff, #f1efe9 55%, #d3cec2); box-shadow: 0 1px 2px rgba(50,32,8,.35); }
  h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: .03em; line-height: 1.15; }
  .sub { margin: 1px 0 0; font-size: 10px; color: var(--muted); letter-spacing: .02em; }
  .actions { display: flex; gap: 6px; }
  button {
    appearance: none;
    border: 1px solid var(--button-border);
    background: var(--button-bg);
    color: var(--button-ink);
    width: 28px;
    height: 28px;
    padding: 0;
    border-radius: 9px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background .15s ease, transform .1s ease, opacity .15s ease;
  }
  button:hover { background: var(--button-hover); }
  button:active { transform: scale(.93); }
  button:disabled { opacity: .3; cursor: default; }
  button:disabled:hover { background: var(--button-bg); }
  button svg { width: 15px; height: 15px; display: block; }
  .board-wrap { flex: 0 0 auto; display: flex; justify-content: center; margin-top: 8px; }
  .board {
    position: relative;
    flex: 0 0 auto;
    width: 336px;
    height: 336px;
    border-radius: 12px;
    background: linear-gradient(150deg, var(--board-bg-1), var(--board-bg-2));
    box-shadow: inset 0 1px 2px var(--board-inset-1), inset 0 -2px 6px var(--board-inset-2);
  }
  .board svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .points { position: absolute; inset: 0; }
  .pt { position: absolute; width: 22px; height: 22px; border-radius: 50%; cursor: pointer; }
  body:not(.myturn) .pt { cursor: default; }
  .pt.filled { pointer-events: none; }
  body.myturn .pt:not(.filled):hover::after {
    content: "";
    position: absolute;
    inset: 1.5px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(100,100,100,.9), rgba(0,0,0,.85));
    opacity: .3;
  }
  .stone {
    position: absolute;
    inset: 1.5px;
    border-radius: 50%;
    animation: pop .13s ease-out;
  }
  .stone.black {
    background: radial-gradient(circle at 35% 30%, #737373, #1a1a1a 56%, #000 100%);
    box-shadow: 0 2px 3px rgba(46,28,4,.45), inset 0 -1px 2px rgba(255,255,255,.08);
  }
  .stone.white {
    background: radial-gradient(circle at 35% 30%, #ffffff, #f2f0ea 56%, #cbc5b8 100%);
    box-shadow: 0 2px 3px rgba(46,28,4,.4), inset 0 -1px 2px rgba(120,110,90,.3);
  }
  .stone.last::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 5px;
    height: 5px;
    margin: -2.5px 0 0 -2.5px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 1.5px rgba(255,255,255,.65);
  }
  .stone.win {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
    box-shadow: 0 0 12px 2px rgba(214,69,56,.55);
  }
  footer { margin-top: auto; flex: 0 0 auto; height: 22px; display: flex; align-items: center; gap: 7px; padding: 0 4px; }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--dot-idle);
    box-shadow: 0 0 0 1px var(--dot-ring);
    transition: background .2s ease;
  }
  .dot.white { background: #fff; animation: pulse 1.1s ease-in-out infinite; }
  .dot.hot { background: var(--accent); animation: none; }
  #status { font-size: 11.5px; color: var(--button-ink); letter-spacing: .02em; }
  .toast {
    position: absolute;
    left: 50%;
    bottom: 38px;
    transform: translate(-50%, 6px);
    max-width: 300px;
    padding: 6px 11px;
    border-radius: 9px;
    background: rgba(38,28,14,.86);
    color: #fff;
    font-size: 11.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @keyframes pop {
    from { transform: scale(.55); opacity: .4; }
    to { transform: scale(1); opacity: 1; }
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(.72); opacity: .55; }
  }
  /* 深色：深胡桃木 + 暖色线条，黑子补一圈浅色边缘 */
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #f0e4cf;
      --muted: rgba(240, 228, 207, .62);
      --accent: #ff6b5e;
      --wood-top: #4a3522;
      --wood-mid: #3b2a1b;
      --wood-bottom: #2c1f14;
      --wood-sheen: rgba(255, 235, 200, .08);
      --wood-sheen-clear: rgba(255, 235, 200, 0);
      --wood-grain: rgba(0, 0, 0, .10);
      --wood-border: rgba(255, 235, 200, .10);
      --wood-inset: rgba(255, 235, 200, .12);
      --wood-inner: rgba(0, 0, 0, .35);
      --button-border: rgba(255, 235, 200, .18);
      --button-bg: rgba(255, 235, 200, .08);
      --button-hover: rgba(255, 235, 200, .16);
      --button-ink: #f0e4cf;
      --board-bg-1: rgba(0, 0, 0, .18);
      --board-bg-2: rgba(0, 0, 0, .28);
      --board-inset-1: rgba(255, 235, 200, .08);
      --board-inset-2: rgba(0, 0, 0, .30);
      --grid-rgb: 240, 228, 207;
      --dot-idle: #f0e4cf;
      --dot-ring: rgba(255, 235, 200, .25);
    }
    body.myturn .pt:not(.filled):hover::after {
      background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.9), rgba(255,255,255,.45));
      opacity: .22;
    }
    .stone.black {
      box-shadow: 0 2px 3px rgba(0,0,0,.55), inset 0 -1px 2px rgba(255,255,255,.10),
                  0 0 0 1px rgba(255,235,200,.14);
    }
    .logo .b {
      box-shadow: 0 1px 2px rgba(0,0,0,.6), 0 0 0 1px rgba(255,235,200,.35);
    }
    .toast {
      background: rgba(15, 10, 6, .92);
      border: 1px solid rgba(255, 235, 200, .12);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .stone { animation: none; }
    .dot.white { animation: none; }
    .toast, button { transition: none; }
  }
</style>
</head>
<body class="myturn">
<div class="panel">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true"><i class="b"></i><i class="w"></i></div>
      <div>
        <h1>五子棋</h1>
        <p class="sub">你执黑 · 先手</p>
      </div>
    </div>
    <div class="actions">
      <button id="undo" title="悔棋" aria-label="悔棋" disabled>
        <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5.5 5.5h6a4 4 0 0 1 0 8H8"/><path d="M7.8 3.2 5.5 5.5l2.3 2.3"/>
        </svg>
      </button>
      <button id="restart" title="重新开始" aria-label="重新开始">
        <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14.5 9a5.5 5.5 0 1 1-1.9-4.2"/><path d="M14.7 3.4v3.9h-3.9"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="board-wrap">
    <div class="board">
      <svg id="grid" viewBox="0 0 336 336" aria-hidden="true"></svg>
      <div class="points" id="points"></div>
    </div>
  </div>

  <footer><span class="dot" id="dot"></span><span id="status">轮到你落子</span></footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script>
(() => {
  'use strict';

  const N = 15;
  const CELL = 22;
  const PAD = 14;
  const SIZE = 336;
  const DIRS = [[0, 1], [1, 0], [1, 1], [1, -1]];

  const board = Array.from({ length: N }, () => Array(N).fill(0));
  const history = [];
  const ptEls = Array.from({ length: N }, () => Array(N).fill(null));

  let turn = 1;        // 1 = 玩家(黑), 2 = AI(白)
  let over = false;
  let aiTimer = null;
  let toastTimer = null;
  let actx = null;

  const pointsEl = document.getElementById('points');
  const gridEl = document.getElementById('grid');
  const statusEl = document.getElementById('status');
  const dotEl = document.getElementById('dot');
  const undoBtn = document.getElementById('undo');
  const restartBtn = document.getElementById('restart');
  const toastEl = document.getElementById('toast');

  window.addEventListener('error', (e) => {
    try { if (window.pinshell && pinshell.log) pinshell.log('gomoku error: ' + e.message); } catch (_) {}
  });

  // ---------- 棋盘网格 ----------
  function drawGrid() {
    const gridRGB = getComputedStyle(document.documentElement)
      .getPropertyValue('--grid-rgb').trim() || '74,52,24';
    const parts = [];
    for (let i = 0; i < N; i++) {
      const p = PAD + i * CELL;
      const edge = i === 0 || i === N - 1;
      const alpha = edge ? 0.62 : 0.4;
      const width = edge ? 1.6 : 1;
      parts.push('<line x1="' + PAD + '" y1="' + p + '" x2="' + (SIZE - PAD) + '" y2="' + p +
        '" stroke="rgba(' + gridRGB + ',' + alpha + ')" stroke-width="' + width + '"/>');
      parts.push('<line x1="' + p + '" y1="' + PAD + '" x2="' + p + '" y2="' + (SIZE - PAD) +
        '" stroke="rgba(' + gridRGB + ',' + alpha + ')" stroke-width="' + width + '"/>');
    }
    for (const [r, c] of [[3, 3], [3, 11], [11, 3], [11, 11], [7, 7]]) {
      parts.push('<circle cx="' + (PAD + c * CELL) + '" cy="' + (PAD + r * CELL) +
        '" r="2.3" fill="rgba(' + gridRGB + ',.62)"/>');
    }
    gridEl.innerHTML = parts.join('');
  }
  drawGrid();
  const colorScheme = window.matchMedia('(prefers-color-scheme: dark)');
  if (colorScheme.addEventListener) colorScheme.addEventListener('change', drawGrid);
  else if (colorScheme.addListener) colorScheme.addListener(drawGrid);

  // ---------- 交叉点 ----------
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const pt = document.createElement('div');
      pt.className = 'pt';
      pt.style.left = (PAD + c * CELL - CELL / 2) + 'px';
      pt.style.top = (PAD + r * CELL - CELL / 2) + 'px';
      pt.addEventListener('click', () => humanPlay(r, c));
      pointsEl.appendChild(pt);
      ptEls[r][c] = pt;
    }
  }

  // ---------- 音效 ----------
  function ensureAudio() {
    try {
      if (!actx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        actx = new AC();
      }
      if (actx.state === 'suspended') actx.resume().catch(() => {});
      return actx;
    } catch (e) {
      return null;
    }
  }

  function tone(freq, dur, vol, type) {
    const ctx = ensureAudio();
    if (!ctx) return;
    try {
      const t = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t);
      osc.frequency.exponentialRampToValueAtTime(Math.max(60, freq * 0.75), t + dur);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(vol, t + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + dur + 0.03);
    } catch (e) {}
  }

  function stoneSound(player) {
    tone(player === 1 ? 200 : 172, 0.08, 0.045, 'triangle');
  }

  function winSound(humanWon) {
    if (humanWon) {
      tone(523.25, 0.16, 0.04, 'sine');
      setTimeout(() => tone(783.99, 0.22, 0.035, 'sine'), 140);
    } else {
      tone(311.13, 0.18, 0.035, 'sine');
      setTimeout(() => tone(233.08, 0.24, 0.03, 'sine'), 150);
    }
  }

  // ---------- 与 agent 通信 ----------
  function emit(name, data) {
    try { if (window.pinshell && pinshell.emit) pinshell.emit(name, data); } catch (e) {}
  }

  function showToast(text) {
    if (!text) return;
    toastEl.textContent = String(text).slice(0, 120);
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3200);
  }

  try {
    if (window.pinshell && pinshell.on) {
      pinshell.on('toast', (d) => showToast(d && d.text));
      pinshell.on('restart', () => restart(true));
    }
  } catch (e) {}

  // ---------- 状态 ----------
  function syncState(text, kind) {
    const myTurn = !over && turn === 1;
    document.body.classList.toggle('myturn', myTurn);

    if (text) {
      statusEl.textContent = text;
      dotEl.className = 'dot' + (kind === 'white' ? ' white' : kind === 'hot' ? ' hot' : '');
    } else if (myTurn) {
      statusEl.textContent = '轮到你落子';
      dotEl.className = 'dot';
    } else if (!over) {
      statusEl.textContent = '我方思考中…';
      dotEl.className = 'dot white';
    }

    undoBtn.disabled = !(history.length > 0 && !aiTimer && (turn === 1 || over));
  }

  // ---------- 棋子 ----------
  function setLast(r, c) {
    for (const st of pointsEl.querySelectorAll('.stone.last')) st.classList.remove('last');
    if (r == null || c == null) return;
    const st = ptEls[r][c].querySelector('.stone');
    if (st) st.classList.add('last');
  }

  function findWin(r, c, p) {
    for (const [dr, dc] of DIRS) {
      const line = [[r, c]];
      for (const s of [1, -1]) {
        let rr = r + dr * s;
        let cc = c + dc * s;
        while (rr >= 0 && rr < N && cc >= 0 && cc < N && board[rr][cc] === p) {
          line.push([rr, cc]);
          rr += dr * s;
          cc += dc * s;
        }
      }
      if (line.length >= 5) return line;
    }
    return null;
  }

  function place(r, c, player) {
    board[r][c] = player;
    history.push({ r, c, p: player });

    const pt = ptEls[r][c];
    pt.classList.add('filled');
    const st = document.createElement('div');
    st.className = 'stone ' + (player === 1 ? 'black' : 'white');
    pt.appendChild(st);
    setLast(r, c);
    stoneSound(player);

    emit('move', {
      row: r,
      col: c,
      player: player,
      moves: history.length,
      board: board.map((row) => row.slice()),
    });

    return findWin(r, c, player);
  }

  function clearWinMarks() {
    for (const st of pointsEl.querySelectorAll('.stone.win')) st.classList.remove('win');
  }

  function finishIfOver(line, player) {
    if (line) {
      over = true;
      for (const [r, c] of line) {
        const st = ptEls[r][c].querySelector('.stone');
        if (st) st.classList.add('win');
      }
      syncState(player === 1 ? '你赢了 · 五子连珠 🎉' : '我赢了 · 再来一局？', 'hot');
      winSound(player === 1);
      emit('game-over', { winner: player });
      return true;
    }
    if (history.length === N * N) {
      over = true;
      syncState('平局 · 再来一局？', 'hot');
      emit('game-over', { winner: 0 });
      return true;
    }
    return false;
  }

  // ---------- 玩家落子 ----------
  function humanPlay(r, c) {
    if (over || turn !== 1 || board[r][c] !== 0) return;
    ensureAudio();

    const line = place(r, c, 1);
    if (finishIfOver(line, 1)) return;

    turn = 2;
    syncState();

    aiTimer = setTimeout(() => {
      aiTimer = null;
      const [ar, ac] = chooseMove();
      const aiLine = place(ar, ac, 2);
      if (finishIfOver(aiLine, 2)) return;
      turn = 1;
      syncState();
    }, 400 + Math.random() * 300);
  }

  // ---------- AI ----------
  function hasNeighbor(r, c, dist) {
    for (let i = -dist; i <= dist; i++) {
      for (let j = -dist; j <= dist; j++) {
        if (i === 0 && j === 0) continue;
        const rr = r + i;
        const cc = c + j;
        if (rr >= 0 && rr < N && cc >= 0 && cc < N && board[rr][cc] !== 0) return true;
      }
    }
    return false;
  }

  function scorePoint(r, c, p) {
    let score = 0;
    for (const [dr, dc] of DIRS) {
      let count = 1;
      let open = 0;
      for (const s of [1, -1]) {
        let rr = r + dr * s;
        let cc = c + dc * s;
        while (rr >= 0 && rr < N && cc >= 0 && cc < N && board[rr][cc] === p) {
          count++;
          rr += dr * s;
          cc += dc * s;
        }
        if (rr >= 0 && rr < N && cc >= 0 && cc < N && board[rr][cc] === 0) open++;
      }
      if (count >= 5) score += 1000000;
      else if (count === 4) score += open === 2 ? 100000 : open === 1 ? 12000 : 0;
      else if (count === 3) score += open === 2 ? 6000 : open === 1 ? 600 : 0;
      else if (count === 2) score += open === 2 ? 300 : open === 1 ? 60 : 0;
      else score += open === 2 ? 14 : 4;
    }
    return score;
  }

  function chooseMove() {
    const cands = [];
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        if (board[r][c] === 0 && hasNeighbor(r, c, 2)) cands.push([r, c]);
      }
    }

    if (cands.length === 0) {
      for (let r = 5; r < 10; r++) {
        for (let c = 5; c < 10; c++) {
          if (board[r][c] === 0) return [r, c];
        }
      }
      return [7, 7];
    }

    let win = null;
    let block = null;
    let blockScore = -1;
    for (const [r, c] of cands) {
      const mine = scorePoint(r, c, 2);
      const theirs = scorePoint(r, c, 1);
      if (mine >= 1000000) { win = [r, c]; break; }
      if (theirs >= 1000000 && theirs > blockScore) {
        blockScore = theirs;
        block = [r, c];
      }
    }
    if (win) return win;
    if (block) return block;

    let best = -Infinity;
    let pick = cands[0];
    for (const [r, c] of cands) {
      const mine = scorePoint(r, c, 2);
      const theirs = scorePoint(r, c, 1);
      const center = 7 - (Math.abs(r - 7) + Math.abs(c - 7));
      const value = mine + theirs * 1.3 + center * 0.7 + Math.random() * 2;
      if (value > best) {
        best = value;
        pick = [r, c];
      }
    }
    return pick;
  }

  // ---------- 悔棋 / 重开 ----------
  function undo() {
    if (aiTimer || history.length === 0) return;

    while (history.length > 0) {
      const m = history.pop();
      board[m.r][m.c] = 0;
      const pt = ptEls[m.r][m.c];
      pt.classList.remove('filled');
      const st = pt.querySelector('.stone');
      if (st) st.remove();
      if (m.p === 1) break;
    }

    over = false;
    clearWinMarks();
    const last = history[history.length - 1];
    setLast(last ? last.r : null, last ? last.c : null);
    turn = 1;
    syncState();
    emit('undo', { moves: history.length });
  }

  function restart(silent) {
    if (aiTimer) {
      clearTimeout(aiTimer);
      aiTimer = null;
    }
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        board[r][c] = 0;
        const pt = ptEls[r][c];
        pt.classList.remove('filled');
        pt.innerHTML = '';
      }
    }
    history.length = 0;
    turn = 1;
    over = false;
    syncState();
    if (!silent) {
      emit('restart', {});
      tone(392, 0.1, 0.03, 'sine');
    }
  }

  undoBtn.addEventListener('click', undo);
  restartBtn.addEventListener('click', () => restart(false));

  syncState();
  emit('ready', { game: 'gomoku' });
})();
</script>
