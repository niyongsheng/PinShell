<style>
*{box-sizing:border-box}

button{font:inherit;color:inherit;background:0 0;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid #2997ff;outline-offset:2px}
.panel{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;padding:16px 18px 18px;color:#f5f5f7;background:radial-gradient(90% 70% at 12% 0,rgba(41,151,255,.1),transparent 55%),radial-gradient(70% 60% at 92% 100%,rgba(255,150,80,.05),transparent 60%),linear-gradient(180deg,rgba(36,36,39,.97),rgba(23,23,25,.97));border:1px solid rgba(255,255,255,.08);border-radius:22px;box-shadow:0 24px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.panel::before{content:'';position:absolute;left:-25%;right:15%;top:-45%;height:75%;background:radial-gradient(ellipse at 50% 50%,rgba(41,151,255,.14),transparent 65%);pointer-events:none}
header{position:relative;z-index:2;flex:none;height:32px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 2px}
.brand{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:650;letter-spacing:-.1px}
.brand svg{color:#2997ff;flex:none}
.header-actions{display:flex;align-items:center;gap:8px}

.icon-btn .icon-off{display:none}
.icon-btn.muted .icon-on{display:none}
.icon-btn.muted .icon-off{display:block}
.options-toggle[aria-pressed="true"]{background:rgba(255,255,255,.08);color:rgba(255,255,255,.9)}
.options-toggle[aria-pressed="false"]{color:rgba(255,255,255,.35)}
.tabs{display:flex;gap:2px;padding:3px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.05)}
.tab{height:24px;padding:0 13px;border-radius:999px;font-size:11.5px;font-weight:600;color:rgba(255,255,255,.45);transition:background .18s ease,color .18s ease}

main{position:relative;z-index:1;flex:1;min-height:0}
.wheel-view{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 216px;gap:16px;min-height:0}

.wheel-wrap.spinning #wheel{cursor:default}

.pointer.tick{animation:pointer-tick .12s ease-out}

100%{transform:translateX(-50%) rotate(0)}
}
.hub{position:absolute;left:50%;top:50%;z-index:3;width:60px;height:60px;margin:-30px 0 0 -30px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 35% 30%,#38383c,#1b1b1e 70%);border:1px solid rgba(255,255,255,.18);box-shadow:0 8px 20px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12);font-size:13px;font-weight:800;letter-spacing:.6px;color:#fff;transition:transform .12s ease,color .15s ease}

}

.result.live{background:rgba(41,151,255,.1);border-color:rgba(41,151,255,.28);color:rgba(255,255,255,.75)}
.result .kicker{flex:none;font-size:11px;color:rgba(255,255,255,.45);white-space:nowrap}
.result .text{font-size:13px;font-weight:600;color:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result.live .text{font-size:15px;font-weight:700;color:#fff}

100%{transform:scale(1);opacity:1}
}

@keyframes confetti-fly{0%{opacity:1;transform:translate(-50%,-50%) rotate(0) scale(1)}
100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--rot)) scale(.55)}
}
.editor{min-height:0;display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07)}

.list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:3px}
.row{flex:none;height:34px;display:flex;align-items:center;gap:7px;padding:0 4px 0 8px;border-radius:8px;transition:background .15s ease,box-shadow .15s ease}
.row:hover{background:rgba(255,255,255,.04)}
.row:focus-within{background:rgba(255,255,255,.06);box-shadow:0 0 0 1px rgba(41,151,255,.45)}
.row .dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.row input{flex:1;min-width:0;width:100%;padding:0 2px;background:0 0;border:0;outline:0;color:#f5f5f7;font-size:12.5px;user-select:text;-webkit-user-select:text}
.row input::placeholder{color:rgba(255,255,255,.26)}
.row input:disabled{opacity:.55}
.row .del{flex:none;width:20px;height:20px;display:grid;place-items:center;border-radius:5px;font-size:14px;line-height:1;color:rgba(255,255,255,.35);opacity:0;transition:opacity .15s ease,background .15s ease,color .15s ease}
.row:focus-within .del,.row:hover .del{opacity:1}
.row .del:hover{background:rgba(255,90,80,.16);color:#ff8a80}
.row .del:disabled{opacity:0!important;pointer-events:none}
.add{flex:none;height:34px;border-radius:9px;border:1px dashed rgba(255,255,255,.14);background:rgba(255,255,255,.03);color:rgba(255,255,255,.55);font-size:12px;transition:background .15s ease,border-color .15s ease,color .15s ease}
.add:hover:not(:disabled){border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.06);color:#fff}
.add:disabled{opacity:.35;cursor:default;border-style:solid}
.coin-view{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.coin-stage{position:relative;width:200px;height:200px;display:grid;place-items:center;perspective:900px;--drift:10px;--wobble:5deg}
.coin-stage::before{content:'';position:absolute;z-index:0;width:210px;height:210px;border-radius:50%;background:radial-gradient(circle,rgba(230,178,63,.14),transparent 64%);filter:blur(6px);pointer-events:none;transition:opacity .4s ease}
.coin-stage.flipping::before{animation:glow-rise var(--flip-dur,2300ms) ease-in-out}
@keyframes glow-rise{0%{transform:translateY(0) scale(1);opacity:1}
46%{transform:translateY(-54px) scale(.8);opacity:.5}
100%{transform:translateY(0) scale(1);opacity:1}
}
.coin-shadow{position:absolute;z-index:0;left:50%;bottom:0;width:138px;height:20px;margin-left:-69px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.62),rgba(0,0,0,0) 70%);filter:blur(3px);opacity:.85;transition:transform .4s ease,opacity .4s ease}
.coin-stage.flipping .coin-shadow{animation:shadow-pulse var(--flip-dur,2300ms) ease-in-out}
@keyframes shadow-pulse{0%{transform:translateX(0) scale(1);opacity:.85}
18%{transform:translateX(calc(var(--drift) * .4)) scale(.58);opacity:.4}
46%{transform:translateX(calc(var(--drift) * .6)) scale(.26);opacity:.14}
74%{transform:translateX(calc(var(--drift) * .4)) scale(.64);opacity:.4}
90%{transform:translateX(calc(var(--drift) * .1)) scale(1.05);opacity:.92}
100%{transform:translateX(0) scale(1);opacity:.85}
}
.coin-lift{position:relative;z-index:1;width:168px;height:168px;transform-style:preserve-3d;transform:rotateX(10deg) rotateY(-9deg)}
.coin-stage.flipping .coin-lift{animation:coin-lift var(--flip-dur,2300ms) linear}
@keyframes coin-lift{0%{transform:translate3d(0,0,0) rotateX(10deg) rotateY(-9deg) rotateZ(0);animation-timing-function:cubic-bezier(.2,.62,.32,1)}
18%{transform:translate3d(calc(var(--drift) * .6),-62px,0) rotateX(13deg) rotateY(-8deg) rotateZ(calc(var(--wobble) * .6));animation-timing-function:cubic-bezier(.32,.42,.52,.96)}
46%{transform:translate3d(var(--drift),-104px,0) rotateX(6deg) rotateY(-6deg) rotateZ(calc(var(--wobble) * -1));animation-timing-function:cubic-bezier(.52,.02,.76,.46)}
74%{transform:translate3d(calc(var(--drift) * .55),-24px,0) rotateX(11deg) rotateY(-8deg) rotateZ(calc(var(--wobble) * .45));animation-timing-function:cubic-bezier(.22,.62,.4,1)}
90%{transform:translate3d(calc(var(--drift) * .12),-2px,0) rotateX(9.7deg) rotateY(-9deg) rotateZ(calc(var(--wobble) * -.15))}
100%{transform:translate3d(0,0,0) rotateX(10deg) rotateY(-9deg) rotateZ(0)}
}
.coin{position:relative;width:168px;height:168px;transform-style:preserve-3d;will-change:transform}
.coin-edge{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}
.coin-edge i{position:absolute;left:50%;top:50%;width:10px;height:13.5px;margin:-6.75px 0 0 -5px;border-radius:1px;box-shadow:inset 0 0 1px rgba(255,255,255,.15)}
.face{position:absolute;inset:0;display:grid;place-items:center;border-radius:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:inset 0 0 0 2px rgba(255,255,255,.34),inset 0 0 0 8px rgba(255,255,255,.1),inset 0 0 0 11px rgba(110,70,5,.4),inset 0 10px 20px rgba(255,255,255,.1),inset 0 -12px 24px rgba(80,45,0,.28),0 12px 32px rgba(0,0,0,.45)}
.face.front{background:radial-gradient(circle at 31% 25%,rgba(255,255,255,.55),transparent 26%),conic-gradient(from 215deg at 50% 50%,rgba(255,255,255,.1),rgba(90,55,0,.13) 18%,rgba(255,255,255,.12) 34%,rgba(90,55,0,.11) 52%,rgba(255,255,255,.14) 70%,rgba(90,55,0,.1) 88%,rgba(255,255,255,.1) 100%),radial-gradient(circle at 50% 46%,#f9db78 0,#eec24f 38%,#d59b28 68%,#b47b17 88%,#96630e 100%);transform:rotateY(0) translateZ(6px)}
.face.back{background:radial-gradient(circle at 69% 27%,rgba(255,255,255,.48),transparent 26%),conic-gradient(from 35deg at 50% 50%,rgba(255,255,255,.09),rgba(90,55,0,.13) 20%,rgba(255,255,255,.11) 36%,rgba(90,55,0,.11) 54%,rgba(255,255,255,.13) 72%,rgba(90,55,0,.1) 90%,rgba(255,255,255,.09) 100%),radial-gradient(circle at 50% 46%,#f4d268 0,#e7b845 38%,#ce9220 68%,#a76e11 88%,#8b5a0b 100%);transform:rotateX(180deg) translateZ(6px)}
.face::before{content:'';position:absolute;inset:17px;border-radius:50%;border:2px dotted rgba(122,74,0,.3);box-shadow:inset 0 1px 2px rgba(255,255,255,.24),0 1px 2px rgba(0,0,0,.16)}
.face::after{content:'';position:absolute;left:12%;top:8%;width:44%;height:30%;border-radius:50%;background:radial-gradient(ellipse at center,rgba(255,255,255,.5),transparent 70%);transform:rotate(-20deg);pointer-events:none}
.face .emblem{position:relative;z-index:1;display:grid;place-items:center;width:94px;height:94px;color:#6a4000;font-size:62px;line-height:1;filter:drop-shadow(0 1px 0 rgba(255,255,255,.4)) drop-shadow(0 2px 3px rgba(70,40,0,.35))}
.coin-result{min-height:30px;display:flex;align-items:center;font-size:15px;color:rgba(255,255,255,.45);transition:color .2s ease}
.coin-result.live{font-size:20px;font-weight:700;color:#fff;letter-spacing:-.2px}
.coin-result.pop{animation:pop .5s cubic-bezier(.2,.9,.3,1)}
.primary{height:44px;padding:0 34px;border-radius:999px;background:#0a84ff;color:#fff;font-size:14px;font-weight:650;box-shadow:0 8px 20px rgba(10,132,255,.28),inset 0 1px 0 rgba(255,255,255,.25);transition:background .15s ease,transform .1s ease,opacity .2s ease}

.primary:disabled{opacity:.5;cursor:default;transform:none}

.emoji-custom input{flex:1;min-width:0;width:100%;height:24px;padding:0 7px;border-radius:6px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);outline:0;color:#f5f5f7;font-size:12px;user-select:text;-webkit-user-select:text}
.emoji-custom input:focus{border-color:rgba(41,151,255,.5);box-shadow:0 0 0 1px rgba(41,151,255,.25)}

.stats>span{display:inline-flex;align-items:center}
.stats .stat-emoji{flex:none;font-size:11.5px;line-height:1;margin-right:4px}
.stats button{padding:2px 4px;border-radius:4px;font-size:11px;color:rgba(255,255,255,.3);transition:background .15s ease,color .15s ease}
.stats button:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.7)}

.result{max-width:min(300px,calc(100vw - 56px))}
.faces{flex-wrap:wrap;justify-content:center}

.wheel-wrap.spinning .hub::before{animation:none}
