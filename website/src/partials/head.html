<!doctype html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="color-scheme" content="light dark">
  {{ROBOTS}}
  <link rel="canonical" href="{{CANONICAL}}">
  <link rel="alternate" hreflang="zh-Hans" href="{{ALT_ZH}}">
  <link rel="alternate" hreflang="en" href="{{ALT_EN}}">
  <link rel="alternate" hreflang="x-default" href="{{ALT_ZH}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{SITE_NAME}}">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL}}">
  <meta property="og:image" content="{{OG_IMAGE}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{TITLE}}">
  <meta property="og:locale" content="{{OG_LOCALE}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{TITLE}}">
  <meta name="twitter:description" content="{{DESCRIPTION}}">
  <meta name="twitter:image" content="{{OG_IMAGE}}">
  <meta name="twitter:image:alt" content="{{TITLE}}">
  <meta name="theme-color" content="#f5f5f7">
  <script>
    // 在样式表之前决定主题，避免深色模式下的白屏闪烁。
    (function () {
      var theme = null;
      try {
        var saved = localStorage.getItem('pinshell-site-theme');
        if (saved === 'light' || saved === 'dark') theme = saved;
      } catch (error) {}
      if (!theme) {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      var root = document.documentElement;
      root.setAttribute('data-theme', theme);
      root.style.colorScheme = theme;
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'dark' ? '#000000' : '#f5f5f7');
    })();
  </script>
  <link rel="icon" href="{{ROOT}}assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="{{ROOT}}assets/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="{{ROOT}}assets/apple-touch-icon.png">
  <link rel="manifest" href="{{ROOT}}assets/site.webmanifest">
  <link rel="stylesheet" href="{{ROOT}}assets/design-tokens.css">
  <link rel="stylesheet" href="{{ROOT}}assets/site.css">
  {{JSON_LD}}
</head>
