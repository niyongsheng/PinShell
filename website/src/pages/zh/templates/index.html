<!-- include: head.html -->
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <!-- include: nav.zh.html -->

  <main id="main" class="gallery-page">
    <header class="gallery-head">
      <p class="eyebrow">Template Library</p>
      <h1>模板库</h1>
      <p class="lead">十款可运行的 HTML 模板，覆盖效率、监控、专注、娱乐与陪伴。预览是真实页面，安装后可独立更新。</p>
    </header>

    <div class="gallery-controls">
      <label class="search-wrap">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <circle cx="8.5" cy="8.5" r="5.5"></circle>
          <path d="M12.8 12.8 17 17" stroke-linecap="round"></path>
        </svg>
        <span class="visually-hidden">搜索模板</span>
        <input class="search" type="search" placeholder="搜索模板…" autocomplete="off" enterkeyhint="search" data-gallery-search>
      </label>
      <div class="chips" role="group" aria-label="按分类筛选">
        {{CATEGORY_FILTERS}}
      </div>
    </div>

    <p class="gallery-meta" data-gallery-meta data-count-one="{{COUNT_ONE}}" data-count-other="{{COUNT_OTHER}}" aria-live="polite"><span class="gallery-count" data-gallery-count>{{TEMPLATE_COUNT}}</span> · 全部为单文件 HTML，可独立更新</p>

    <div class="gallery-grid">
      <div class="template-grid" data-gallery-grid>
        {{TEMPLATE_CARDS}}
      </div>
      <p class="empty-state" data-empty-state hidden>没有匹配的模板。换个关键词，或选择“全部”。</p>
    </div>

    <div class="install-hint">
      <div class="hint-card">
        <span class="hint-key">PR</span>
        <p>模板库也欢迎你的作品。单文件 HTML，无需构建，提 PR 即可上架。<a class="text-link" href="{{GITHUB_URL}}/blob/main/docs/template-contribution.zh-CN.md">阅读贡献指南 →</a></p>
      </div>
    </div>
  </main>

  <!-- include: footer.zh.html -->
