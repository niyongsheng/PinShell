name: CI

on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]

jobs:
  build:
    # 必须用带 macOS 26+ SDK 的镜像：AppKit 按 LC_BUILD_VERSION.sdk 决定是否
    # 启用 Liquid Glass，macOS 15 runner（SDK 15.x）会退回经典控件外观。
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: swift test

      # 打 tag 时把版本写进 Info.plist，make app 组装 bundle 时一并生效
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          plutil -replace CFBundleShortVersionString -string "${VERSION}" Resources/Info.plist

      - name: Validate website catalog
        run: |
          swift run --package-path website -c release TemplateCatalogBuilder \
            --check --site-url https://pinshell.looplooptech.com

      # PR 构建用 native（快）；发布用 universal（arm64 + x86_64）
      - name: Build app
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            make app ARCH=universal
          else
            make app
          fi

      # Makefile 会把缺失的 sdk 字段改写为真实 SDK 版本；这里兜底校验，
      # 避免 runner 回退导致安装包丢失 Liquid Glass 外观。
      - name: Verify Liquid Glass SDK
        run: |
          vtool -show-build build/PinShell.app/Contents/MacOS/PinShell | tee build-version.txt
          grep -Eq "sdk (2[6-9]|[3-9][0-9])" build-version.txt || {
            echo "error: app is linked against macOS SDK < 26; Liquid Glass will fall back to legacy controls." >&2
            exit 1
          }

      - name: Package DMG
        run: |
          APP="build/PinShell.app"
          TMP="dmg_tmp"

          mkdir -p "$TMP"
          cp -R "$APP" "$TMP/"
          ln -s /Applications "$TMP/Applications"

          hdiutil create -volname PinShell -srcfolder "$TMP" -ov -format UDZO "PinShell.dmg"
          rm -rf "$TMP"

      - name: Package ZIP
        run: zip -ry "PinShell.zip" "build/PinShell.app"

      # postinstall 会清除 /Applications/PinShell.app 的 com.apple.quarantine
      - name: Package PKG
        run: |
          make pkg
          pkgutil --payload-files build/PinShell.pkg

      - name: Upload app (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PinShell.app
          path: build/PinShell.app

      - name: Upload DMG (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PinShell.dmg
          path: PinShell.dmg

      - name: Upload ZIP (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PinShell.zip
          path: PinShell.zip

      - name: Upload PKG (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PinShell.pkg
          path: build/PinShell.pkg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 生成 What's Changed 需要完整 tag 历史
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: PinShell.dmg
          path: release-artifacts

      - uses: actions/download-artifact@v4
        with:
          name: PinShell.zip
          path: release-artifacts

      - uses: actions/download-artifact@v4
        with:
          name: PinShell.pkg
          path: release-artifacts

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Prepare release assets
        run: |
          cd release-artifacts
          VERSION="${{ steps.version.outputs.VERSION }}"

          mv PinShell.dmg "PinShell-${VERSION}.dmg"
          mv PinShell.zip "PinShell-${VERSION}.zip"
          mv PinShell.pkg "PinShell-${VERSION}-mac-universal.pkg"
          # 稳定文件名，便于 README / 官网永远指向最新安装包：
          # https://github.com/niyongsheng/PinShell/releases/latest/download/PinShell.pkg
          cp "PinShell-${VERSION}-mac-universal.pkg" PinShell.pkg

          ls -lh

      - name: Compose release body
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          BASE="https://github.com/${REPO}/releases/download/${TAG}"
          PREV_TAG=$(git describe --tags --abbrev=0 --exclude "$TAG" HEAD 2>/dev/null || true)
          {
            echo "## Download"
            echo
            echo "| Platform | Installer |"
            echo "| --- | --- |"
            echo "| macOS 13+ (Apple Silicon & Intel) | [PinShell-${VERSION}-mac-universal.pkg](${BASE}/PinShell-${VERSION}-mac-universal.pkg) |"
            echo
            echo "> **Gatekeeper:** if macOS blocks the downloaded package, run \`xattr -dr com.apple.quarantine ~/Downloads/PinShell-*.pkg\` before opening it. The installer clears the quarantine flag from the app automatically."
            if [ -n "$PREV_TAG" ]; then
              CHANGES=$(git log --no-merges --reverse --format='- %s (%h)' "${PREV_TAG}..HEAD" | grep -E '^- (feat|fix|perf)(\(|:)' || true)
              echo
              echo "## What's Changed"
              echo
              if [ -n "$CHANGES" ]; then
                echo "$CHANGES"
                echo
              fi
              echo "**Full Changelog**: https://github.com/${REPO}/compare/${PREV_TAG}...${TAG}"
            fi
          } > release-body.md
          cat release-body.md

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-body.md
          files: release-artifacts/*
