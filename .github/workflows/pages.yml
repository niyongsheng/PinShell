name: Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "Sources/PinShellCore/**"
      - "Resources/templates/**"
      - "Resources/Info.plist"
      - "Resources/logo.svg"
      - "Package.swift"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        id: pages

      - name: Build website and template catalog
        run: |
          swift run --package-path website -c release TemplateCatalogBuilder \
            --output website/public \
            --site-url "https://pinshell.looplooptech.com"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
