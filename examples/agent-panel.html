<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Panel</title>
<meta name="description" content="用户与 agent 的双向交互示例">
<meta name="pinshell:size" content="380x200">
<meta name="pinshell:position" content="bottom-right">
<meta name="pinshell:radius" content="16">
<style>
  html, body {
    width: 100%; height: 100%;
    margin: 0; padding: 0;
    background: transparent;
    overflow: hidden;
    font: 13px -apple-system, "SF Pro Text", system-ui, sans-serif;
    color: #f5f5f7;
  }
  .panel {
    position: absolute; inset: 0;
    box-sizing: border-box;
    padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
    background: rgba(29, 29, 31, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.10);
    border-radius: 16px;
  }
  .title { font-size: 14px; font-weight: 600; }
  .status {
    flex: 1;
    color: #cccccc;
    overflow: auto;
    white-space: pre-wrap;
  }
  .row { display: flex; gap: 8px; }
  input {
    flex: 1; min-width: 0;
    padding: 6px 9px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: rgba(255, 255, 255, 0.08);
    color: #fff;
    outline: none;
  }
  button {
    padding: 6px 12px;
    border: 0; border-radius: 999px;
    background: #2997ff; color: #fff;
    font: inherit; font-weight: 600;
    cursor: pointer;
  }
  button.secondary { background: rgba(255, 255, 255, 0.14); }
</style>
</head>
<body>
<div class="panel">
  <div class="title">Agent 交互窗口</div>
  <div class="status" id="status">等待 agent 消息…</div>
  <div class="row">
    <input id="input" placeholder="输入回复，回车发送" autofocus>
    <button id="send">发送</button>
  </div>
  <div class="row">
    <button id="approve">批准</button>
    <button id="reject" class="secondary">拒绝</button>
  </div>
</div>
<script>
  const statusEl = document.getElementById('status');
  const inputEl = document.getElementById('input');

  function log(line) {
    statusEl.textContent = line + '\n' + statusEl.textContent;
  }

  function send() {
    const text = inputEl.value.trim();
    if (!text) return;
    pinshell.emit('message', { text });
    inputEl.value = '';
  }

  document.getElementById('send').addEventListener('click', send);
  inputEl.addEventListener('keydown', function (event) {
    if (event.key === 'Enter') send();
  });
  document.getElementById('approve').addEventListener('click', function () {
    pinshell.emit('decision', { approved: true });
  });
  document.getElementById('reject').addEventListener('click', function () {
    pinshell.emit('decision', { approved: false });
  });

  pinshell.on('agent:message', function (data) {
    log('agent: ' + JSON.stringify(data));
  });

  pinshell.emit('ready', { at: Date.now() });
</script>
</body>
</html>
