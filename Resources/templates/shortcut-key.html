<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>按键提示</title>
<link rel="stylesheet" href="design-tokens.css">
<style>
.card {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 16px;
  background: var(--ps-surface-tile-1);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: var(--ps-radius-lg);
  box-sizing: border-box;
  overflow: hidden;
}
.keys {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: none;
}
.key {
  min-width: 34px;
  height: 34px;
  padding: 0 9px;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(180deg, #3f3f42, #2c2c2f);
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 9px;
  box-shadow: 0 2px 0 rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.18);
  font-size: 15px; font-weight: 600;
  color: var(--ps-body-on-dark);
  box-sizing: border-box;
  white-space: nowrap;
}
.plus {
  font-size: 12px;
  color: rgba(255, 255, 255, 0.40);
}
.desc {
  font-size: 13px;
  letter-spacing: -0.1px;
  color: var(--ps-body-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
</style>
</head>
<body>
<div class="card ps-dim-surface">
  <div class="keys" id="keys"></div>
  <span class="desc" id="desc">重新加载直播</span>
</div>
<script>
// 业务数据：按键序列 + 说明文字（PinShell 不介入）
const KEYMAP = {
  keys: ["⌘", "⇧", "R"],
  desc: "重新加载直播",
};
const keysEl = document.getElementById("keys");
const descEl = document.getElementById("desc");
function render() {
  keysEl.innerHTML = KEYMAP.keys
    .map(k => `<span class="key">${k}</span>`)
    .join('<span class="plus">+</span>');
  descEl.textContent = KEYMAP.desc;
}
render();
</script>
</body>
</html>
