<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIVE 状态点</title>
<meta name="description" content="通过 OBS WebSocket 实时监听直播推流状态">
<meta name="pinshell:size" content="120x48">
<meta name="pinshell:order" content="3">
<link rel="stylesheet" href="design-tokens.css">
<style>
.badge {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--ps-surface-tile-1);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: var(--ps-radius-pill);
  box-sizing: border-box;
  transition: background 0.3s ease, border-color 0.3s ease;
}
.badge.live {
  background: rgba(255, 59, 48, 0.14);
  border-color: rgba(255, 59, 48, 0.32);
}
.dot {
  width: 8px; height: 8px;
  border-radius: 9999px;
  background: #6e6e73;
  transition: background 0.25s ease;
}
.badge.live .dot {
  background: #ff3b30;
  box-shadow: 0 0 0 4px rgba(255, 59, 48, 0.12);
  animation: pulse 1.6s ease-in-out infinite;
}
.badge.connecting .dot { background: #ff9f0a; animation: pulse 1.2s ease-in-out infinite; }
.badge.error .dot { background: #ff9f0a; }
.label {
  font-size: 12px; font-weight: 650;
  letter-spacing: 0.08em;
  color: var(--ps-body-muted);
  white-space: nowrap;
}
.badge.live .label { color: #ff8a82; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.35; }
}
</style>
</head>
<body>
<div class="badge offline" id="badge">
  <span class="dot"></span>
  <span class="label" id="label">OBS…</span>
</div>
<script>
// ── OBS WebSocket 配置（OBS 28+ 自带 WebSocket 服务）────────────────
// OBS → 工具 → WebSocket 服务器设置：确认已启用，默认端口 4455。
// 若开启了认证，把密码填在这里。
const CONFIG = {
  url: 'ws://127.0.0.1:4455',
  password: '',
};
// ────────────────────────────────────────────────────────────────────

const bridge = window.pinshell || { on() {}, emit() {} };
const badge = document.getElementById('badge');
const label = document.getElementById('label');

let socket = null;
let identified = false;
let requestSeq = 0;
let retryTimer = null;
let pollTimer = null;
let externalOverride = false;

function setState(state, text) {
  badge.classList.remove('live', 'offline', 'connecting', 'error');
  badge.classList.add(state);
  label.textContent = text;
}

function updateStreaming(active, emit = true) {
  if (externalOverride) return;
  const live = !!active;
  setState(live ? 'live' : 'offline', live ? 'LIVE' : 'OFFLINE');
  if (emit) bridge.emit('obs:status', { live, connected: identified });
}

async function sha256Base64(text) {
  const data = new TextEncoder().encode(text);
  const digest = await crypto.subtle.digest('SHA-256', data);
  const bytes = new Uint8Array(digest);
  let binary = '';
  for (let i = 0; i < bytes.length; i += 1) binary += String.fromCharCode(bytes[i]);
  return btoa(binary);
}

function send(payload) {
  if (socket && socket.readyState === WebSocket.OPEN) {
    socket.send(JSON.stringify(payload));
  }
}

function requestStreamStatus() {
  send({
    op: 6,
    d: {
      requestType: 'GetStreamStatus',
      requestId: 'stream-status-' + (++requestSeq),
    },
  });
}

async function identify(hello) {
  const payload = { rpcVersion: 1, eventSubscriptions: 1 << 6 }; // Outputs
  const auth = hello && hello.authentication;
  if (auth) {
    if (!CONFIG.password) {
      setState('error', 'OBS 需密码');
      socket.close();
      return;
    }
    try {
      const secret = await sha256Base64(CONFIG.password + auth.salt);
      payload.authentication = await sha256Base64(secret + auth.challenge);
    } catch (error) {
      setState('error', 'OBS 认证失败');
      socket.close();
      return;
    }
  }
  send({ op: 1, d: payload });
}

function connect() {
  clearTimeout(retryTimer);
  retryTimer = null;
  if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) {
    return;
  }

  setState('connecting', 'OBS…');

  try {
    socket = new WebSocket(CONFIG.url);
  } catch (error) {
    setState('error', 'OBS 离线');
    scheduleRetry();
    return;
  }

  socket.onopen = function () {
    setState('connecting', 'OBS…');
  };

  socket.onmessage = function (event) {
    let message;
    try { message = JSON.parse(event.data); } catch (error) { return; }

    if (message.op === 0) {              // Hello
      identify(message.d || {});
    } else if (message.op === 2) {       // Identified
      identified = true;
      setState('offline', 'OFFLINE');
      requestStreamStatus();
      clearInterval(pollTimer);
      pollTimer = setInterval(requestStreamStatus, 10000);
    } else if (message.op === 5) {       // Event
      const data = message.d || {};
      if (data.eventType === 'StreamStateChanged') {
        updateStreaming(data.eventData && data.eventData.outputActive);
      }
    } else if (message.op === 7) {       // RequestResponse
      const data = message.d || {};
      if (data.requestType === 'GetStreamStatus') {
        const ok = data.requestStatus && data.requestStatus.result;
        if (ok && data.responseData) {
          updateStreaming(data.responseData.outputActive);
        }
      }
    }
  };

  socket.onerror = function () {
    setState('error', 'OBS 离线');
  };

  socket.onclose = function () {
    identified = false;
    clearInterval(pollTimer);
    pollTimer = null;
    socket = null;
    if (!externalOverride) setState('error', 'OBS 离线');
    scheduleRetry();
  };
}

function scheduleRetry() {
  clearTimeout(retryTimer);
  retryTimer = setTimeout(connect, 3000);
}

// agent / CLI 也可以直接驱动：PinShell emit obs:status '{"live":true}'
bridge.on('obs:status', data => {
  if (!data) return;
  externalOverride = true;
  const live = !!(data.live ?? data.streaming);
  setState(live ? 'live' : 'offline', live ? 'LIVE' : 'OFFLINE');
});

connect();
</script>
</body>
</html>
