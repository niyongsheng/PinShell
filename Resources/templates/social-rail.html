<title>社交胶囊栏</title>
<meta name="description" content="一行账号胶囊平铺，静态展示">

<link rel="stylesheet" href="design-tokens.css">
<style>
.rail {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 12px;
  background: var(--ps-surface-tile-1);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: var(--ps-radius-lg);
  box-sizing: border-box;
}
.chip {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0 12px;
  height: 32px;
  background: rgba(210, 210, 215, 0.16);
  border-radius: var(--ps-radius-pill);
  font-size: 12px;
  color: var(--ps-body-on-dark);
  white-space: nowrap;
}
.chip svg {
  width: 15px; height: 15px;
  fill: currentColor;
}
/* 品牌色：X 用白（品牌黑在深色卡上不可见），其余用品牌色 */
.chip.brand-x          { color: #FFFFFF; }
.chip.brand-wechat     { color: #07C160; }
.chip.brand-bilibili   { color: #00A1D6; }
.chip .handle {
  font-weight: 600;
  letter-spacing: -0.16px;
  color: var(--ps-body-on-dark);
}
</style>
</head>
