<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>角标水印</title>
<link rel="stylesheet" href="design-tokens.css">
<style>
html, body {
  width: 100%; height: 100%;
  margin: 0; padding: 0;
  background: transparent;
  overflow: hidden;
  font-family: var(--ps-font-text);
  -webkit-font-smoothing: antialiased;
}
.wm {
  position: absolute;
  right: 8px; bottom: 8px;
  display: flex;
  align-items: center;
  gap: 7px;
  height: 36px;
  padding: 0 14px;
  background: #141416;
  border: 1px solid rgba(255, 255, 255, 0.10);
  border-radius: var(--ps-radius-pill);
  box-sizing: border-box;
  white-space: nowrap;
}
/* 品牌红点（logo #FD3532） */
.dot {
  width: 6px; height: 6px;
  border-radius: 9999px;
  background: #FD3532;
}
.time {
  font-size: 13px; font-weight: 600;
  letter-spacing: 0.02em;
  font-variant-numeric: tabular-nums;   /* 等宽数字，秒跳动不抖动 */
  color: #FFFFFF;
}
.sep {
  font-size: 10px;
  color: rgba(255, 255, 255, 0.35);
}
.date {
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  color: rgba(255, 255, 255, 0.65);
}
.name {
  font-size: 11px; font-weight: 600;
  letter-spacing: -0.12px;
  color: rgba(255, 255, 255, 0.85);
}
.handle {
  font-size: 11px;
  color: rgba(255, 255, 255, 0.65);
}
</style>
</head>
<body>
<div class="wm ps-float">
  <span class="dot"></span>
  <span class="time" id="time">--:--:--</span>
  <span class="sep">·</span>
  <span class="date" id="date">--</span>
  <span class="sep">·</span>
  <span class="name">PinShell</span>
  <span class="sep">·</span>
  <span class="handle">@niyongsheng</span>
</div>
<script>
// 实时时钟：每秒刷新（时间信息由业务 HTML 自己维护，PinShell 不介入）
const timeEl = document.getElementById("time");
const dateEl = document.getElementById("date");
const pad = n => String(n).padStart(2, "0");
function tick() {
  const d = new Date();
  timeEl.textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  dateEl.textContent = `${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
