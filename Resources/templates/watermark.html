<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时间水印</title>
<meta name="description" content="低对比度常驻实时时间水印">
<meta name="pinshell:size" content="200x56">
<meta name="pinshell:order" content="5">
<link rel="stylesheet" href="design-tokens.css">
<style>
.wm {
  position: absolute;
  right: 8px; bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
  height: 36px;
  padding: 0 14px;
  background: #141416;
  border: 1px solid rgba(255, 255, 255, 0.10);
  border-radius: var(--ps-radius-pill);
  box-sizing: border-box;
  white-space: nowrap;
  overflow: hidden;
}
.clock {
  width: 12px; height: 12px;
  flex: none;
  stroke: rgba(255, 255, 255, 0.55);
  fill: none;
  stroke-width: 1.4;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.time {
  font-size: 14px; font-weight: 600;
  letter-spacing: 0.02em;
  font-variant-numeric: tabular-nums;   /* 等宽数字，秒跳动不抖动 */
  color: #FFFFFF;
}
.divider {
  width: 1px; height: 12px;
  flex: none;
  background: rgba(255, 255, 255, 0.14);
}
.date {
  font-size: 10.5px;
  font-variant-numeric: tabular-nums;
  color: rgba(255, 255, 255, 0.55);
}
/* 穿透模式（PinShell 给 <html> 加 passthrough class）：只淡背景，文字保持实 —— 全权由 HTML 控制。
   透明度数值来自菜单滑块（--ps-passthrough-opacity，token 默认值见 design-tokens.css）。
   底色刻意更深（#141416），故不挂共享的 ps-dim-surface，独立声明 */
html.passthrough .wm {
  background: rgba(20, 20, 22, var(--ps-passthrough-opacity));
  border-color: rgba(255, 255, 255, 0.06);
}
</style>
</head>
<body>
<div class="wm ps-float">
  <svg class="clock" viewBox="0 0 16 16" aria-hidden="true">
    <circle cx="8" cy="8" r="6.2"/>
    <path d="M8 4.4V8l2.5 1.5"/>
  </svg>
  <span class="time" id="time">--:--:--</span>
  <span class="divider"></span>
  <span class="date" id="date">--</span>
</div>
<script>
// 实时时钟：每秒刷新
const timeEl = document.getElementById("time");
const dateEl = document.getElementById("date");
const pad = n => String(n).padStart(2, "0");
function tick() {
  const d = new Date();
  timeEl.textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  dateEl.textContent = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
