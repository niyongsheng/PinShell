<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>番茄时钟</title>
<meta name="description" content="专注 25 分钟 · 短休息 5 分钟 · 每 4 轮长休息">
<meta name="pinshell:size" content="280x320">
<meta name="pinshell:radius" content="20">
<meta name="pinshell:order" content="9">
<link rel="stylesheet" href="design-tokens.css">
<style>
  * { box-sizing: border-box; }

  .panel {
    --accent: #ff6b4a;
    --accent-rgb: 255, 107, 74;
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    gap: 10px;
    padding: 14px 16px 12px;
    background: rgba(28, 28, 30, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 20px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.38);
    overflow: hidden;
    color: #f5f5f7;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: border-color 0.3s ease;
  }
  /* 顶部随阶段变化的柔光，只做氛围，不抢内容 */
  .panel::before {
    content: '';
    position: absolute; left: -20%; right: -20%; top: -45%; height: 75%;
    background: radial-gradient(ellipse at 50% 50%,
      rgba(var(--accent-rgb), 0.16), rgba(var(--accent-rgb), 0.04) 55%, transparent 72%);
    pointer-events: none;
  }
  .panel.flash {
    animation: flash 0.9s ease-out;
  }
  @keyframes flash {
    0% {
      border-color: rgba(var(--accent-rgb), 0.95);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.38),
                  0 0 0 1px rgba(var(--accent-rgb), 0.45),
                  0 0 34px rgba(var(--accent-rgb), 0.38);
    }
    100% {
      border-color: rgba(255, 255, 255, 0.09);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.38);
    }
  }

  header {
    position: relative; z-index: 1;
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px;
  }
  .title {
    display: flex; align-items: center; gap: 7px;
    font-size: 13px; font-weight: 650; letter-spacing: -0.1px;
    white-space: nowrap;
  }
  .tomato { width: 15px; height: 15px; flex: none; }
  .cycle {
    display: inline-flex; align-items: center; gap: 4px;
    height: 22px; padding: 0 9px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.055);
    border: 1px solid rgba(255, 255, 255, 0.07);
    font-size: 10px; font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: rgba(255, 255, 255, 0.42);
    white-space: nowrap;
  }
  .cycle b { color: var(--accent); font-weight: 700; }

  .dial-wrap {
    position: relative; z-index: 1;
    flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .dial {
    position: relative;
    width: 176px; height: 176px;
    cursor: pointer;
    outline: none;
    border-radius: 50%;
  }
  .dial svg { width: 100%; height: 100%; display: block; transform: rotate(-90deg); overflow: visible; }
  .track { fill: none; stroke: rgba(255, 255, 255, 0.075); stroke-width: 7; }
  .progress {
    fill: none;
    stroke: var(--accent);
    stroke-width: 7;
    stroke-linecap: round;
    filter: drop-shadow(0 0 6px rgba(var(--accent-rgb), 0.42));
    transition: stroke-dashoffset 0.35s linear, stroke 0.4s ease, filter 0.4s ease;
  }
  .dial.running .progress { filter: drop-shadow(0 0 9px rgba(var(--accent-rgb), 0.58)); }
  .readout {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 4px;
    pointer-events: none;
  }
  .phase {
    display: flex; align-items: center; gap: 5px;
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.14em;
    color: var(--accent);
  }
  .phase-dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent);
    transition: background 0.4s ease;
  }
  .dial.running .phase-dot { animation: breathe 1.8s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.35; transform: scale(0.78); }
  }
  .time {
    font-family: "SF Pro Display", -apple-system, system-ui, sans-serif;
    font-size: 42px; font-weight: 300;
    line-height: 1.05;
    letter-spacing: -1.5px;
    font-variant-numeric: tabular-nums;
    color: #ffffff;
  }
  .hint {
    min-height: 12px;
    font-size: 10px;
    color: rgba(255, 255, 255, 0.30);
    transition: color 0.2s ease;
  }
  .dial:hover .hint { color: rgba(255, 255, 255, 0.55); }
  .dial:focus-visible { outline: 2px solid var(--ps-primary-focus); outline-offset: 3px; }

  .controls {
    position: relative; z-index: 1;
    display: flex; align-items: center; justify-content: center;
    gap: 10px;
  }
  .icon-btn {
    width: 36px; height: 36px; flex: none;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.055);
    color: rgba(255, 255, 255, 0.62);
    cursor: pointer; padding: 0;
    transition: background 0.16s ease, color 0.16s ease, transform 0.12s ease;
  }
  .icon-btn:hover { background: rgba(255, 255, 255, 0.11); color: #ffffff; }
  .icon-btn:active { transform: scale(0.93); }
  .icon-btn:focus-visible { outline: 2px solid var(--ps-primary-focus); outline-offset: 2px; }
  .icon-btn svg { width: 15px; height: 15px; }

  .primary {
    height: 38px; min-width: 112px; padding: 0 18px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    border: 0; border-radius: 999px;
    background: linear-gradient(180deg, #3aa0ff, #0077e6);
    box-shadow: 0 6px 16px rgba(0, 122, 255, 0.30),
                inset 0 1px 0 rgba(255, 255, 255, 0.22);
    color: #ffffff;
    font: inherit; font-size: 12.5px; font-weight: 650;
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.12s ease;
  }
  .primary:hover { filter: brightness(1.08); }
  .primary:active { transform: scale(0.96); }
  .primary:focus-visible { outline: 2px solid var(--ps-primary-focus); outline-offset: 2px; }
  .primary svg { width: 12px; height: 12px; flex: none; }

  .streak {
    position: relative; z-index: 1;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    font-size: 9.5px;
    font-variant-numeric: tabular-nums;
    color: rgba(255, 255, 255, 0.28);
    white-space: nowrap;
  }
  .streak b { color: rgba(255, 255, 255, 0.48); font-weight: 600; }

  @media (prefers-reduced-motion: reduce) {
    .phase-dot, .panel.flash { animation: none !important; }
    .progress { transition: none; }
  }
</style>
</head>
<body>
<div class="panel ps-dim-surface" id="panel">
  <header>
    <div class="title">
      <svg class="tomato" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M8 4.7c-2.9 0-5.1 2.1-5.1 4.7s2.2 4.7 5.1 4.7 5.1-2.1 5.1-4.7S10.9 4.7 8 4.7Z" fill="var(--accent)"/>
        <path d="M8 4.9c-.4-1.2-1.3-2-2.7-2.1.2 1 .9 1.7 1.9 2.1-.8 0-1.6.2-2.2.7 1.1.5 2.1.4 3-.1.9.5 1.9.6 3 .1-.6-.5-1.4-.7-2.2-.7 1-.4 1.7-1.1 1.9-2.1-1.4.1-2.3.9-2.7 2.1Z" fill="#30d158"/>
      </svg>
      番茄时钟
    </div>
    <div class="cycle" title="当前循环进度"><b id="cycleCount">0</b><span>/</span><span id="cycleTotal">4</span></div>
  </header>

  <div class="dial-wrap">
    <div class="dial" id="dial" role="button" tabindex="0" aria-label="开始或暂停计时">
      <svg viewBox="0 0 180 180" aria-hidden="true">
        <circle class="track" cx="90" cy="90" r="78"></circle>
        <circle class="progress" id="ring" cx="90" cy="90" r="78"></circle>
      </svg>
      <div class="readout">
        <div class="phase"><span class="phase-dot"></span><span id="phaseLabel">专注</span></div>
        <div class="time" id="time">25:00</div>
        <div class="hint" id="hint">点击开始专注</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="icon-btn" id="resetBtn" type="button" title="重置本轮" aria-label="重置本轮">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3.2 7.2A4.8 4.8 0 1 1 4.6 11"/>
        <path d="M3.1 3.4v3.9h3.9"/>
      </svg>
    </button>
    <button class="primary" id="toggleBtn" type="button" aria-pressed="false">
      <span id="toggleIcon" style="display:flex"></span><span id="toggleLabel">开始</span>
    </button>
    <button class="icon-btn" id="skipBtn" type="button" title="跳到下一阶段" aria-label="跳到下一阶段">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 3.4 10.4 8 4 12.6z" fill="currentColor" stroke="none"/>
        <path d="M12 3.4v9.2"/>
      </svg>
    </button>
  </div>

  <div class="streak">累计完成 <b id="totalCount">0</b> 个番茄</div>
</div>

<script>
  // ── 配置：按自己的节奏修改时长 / 每轮番茄数 ─────────────────────
  const CONFIG = {
    focusMinutes: 25,
    shortBreakMinutes: 5,
    longBreakMinutes: 15,
    cycle: 4,
    chime: true,
  };
  // ────────────────────────────────────────────────────────────────

  const PHASES = {
    focus: { label: '专注', minutes: CONFIG.focusMinutes, accent: '#ff6b4a', rgb: '255, 107, 74' },
    short: { label: '短休息', minutes: CONFIG.shortBreakMinutes, accent: '#30d158', rgb: '48, 209, 88' },
    long: { label: '长休息', minutes: CONFIG.longBreakMinutes, accent: '#64d2ff', rgb: '100, 210, 255' },
  };
  const STORAGE_KEY = 'pinshell.pomodoro.v1';
  const bridge = window.pinshell || { emit() {}, on() {}, log() {} };

  const els = {
    panel: document.getElementById('panel'),
    dial: document.getElementById('dial'),
    ring: document.getElementById('ring'),
    time: document.getElementById('time'),
    phaseLabel: document.getElementById('phaseLabel'),
    hint: document.getElementById('hint'),
    cycleCount: document.getElementById('cycleCount'),
    cycleTotal: document.getElementById('cycleTotal'),
    totalCount: document.getElementById('totalCount'),
    toggleBtn: document.getElementById('toggleBtn'),
    toggleLabel: document.getElementById('toggleLabel'),
    toggleIcon: document.getElementById('toggleIcon'),
    resetBtn: document.getElementById('resetBtn'),
    skipBtn: document.getElementById('skipBtn'),
  };

  const CIRCUMFERENCE = 2 * Math.PI * 78;
  els.ring.style.strokeDasharray = CIRCUMFERENCE + ' ' + CIRCUMFERENCE;
  els.cycleTotal.textContent = String(CONFIG.cycle);

  const PLAY_ICON = '<svg viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><path d="M2.6 1.6a.7.7 0 0 1 1.05-.6l7 4.4a.7.7 0 0 1 0 1.2l-7 4.4A.7.7 0 0 1 2.6 10.4z"/></svg>';
  const PAUSE_ICON = '<svg viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><rect x="2.4" y="1.8" width="2.8" height="8.4" rx="1"/><rect x="6.8" y="1.8" width="2.8" height="8.4" rx="1"/></svg>';

  function duration(phase) {
    return PHASES[phase].minutes * 60 * 1000;
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      const saved = JSON.parse(raw);
      if (!saved || !PHASES[saved.phase]) return null;

      const total = duration(saved.phase);
      const remaining = Number.isFinite(saved.remaining)
        ? Math.min(Math.max(saved.remaining, 0), total)
        : total;
      const state = {
        phase: saved.phase,
        cycle: Number.isFinite(saved.cycle) ? Math.min(Math.max(saved.cycle | 0, 0), CONFIG.cycle) : 0,
        completed: Number.isFinite(saved.completed) ? Math.max(saved.completed | 0, 0) : 0,
        running: !!saved.running,
        endsAt: Number.isFinite(saved.endsAt) ? saved.endsAt : null,
        remaining,
      };

      if (state.running) {
        if (state.endsAt) {
          state.remaining = Math.max(0, state.endsAt - Date.now());
        } else {
          state.running = false;
        }
      }
      return state;
    } catch (error) {
      return null;
    }
  }

  let state = loadState() || {
    phase: 'focus',
    cycle: 0,
    completed: 0,
    running: false,
    endsAt: null,
    remaining: duration('focus'),
  };
  let lastSecond = -1;
  let flashTimer = null;

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        phase: state.phase,
        cycle: state.cycle,
        completed: state.completed,
        running: state.running,
        endsAt: state.running ? state.endsAt : null,
        remaining: Math.round(state.remaining),
      }));
    } catch (error) {}
  }

  function snapshot() {
    return {
      phase: state.phase,
      label: PHASES[state.phase].label,
      running: state.running,
      remainingMs: Math.max(0, Math.round(state.remaining)),
      remainingSeconds: Math.max(0, Math.ceil(state.remaining / 1000)),
      cycle: state.cycle,
      cycleTotal: CONFIG.cycle,
      completed: state.completed,
    };
  }

  function emitChanged() {
    bridge.emit('pomodoro:changed', snapshot());
  }

  function render(force) {
    const phase = PHASES[state.phase];
    const total = duration(state.phase);
    const left = Math.max(0, state.remaining);
    const seconds = Math.max(0, Math.ceil(left / 1000));

    if (force || seconds !== lastSecond) {
      lastSecond = seconds;
      const minutes = String(Math.floor(seconds / 60)).padStart(2, '0');
      const rest = String(seconds % 60).padStart(2, '0');
      els.time.textContent = minutes + ':' + rest;
    }

    els.ring.style.strokeDashoffset = String(CIRCUMFERENCE * (1 - left / total));
    els.panel.style.setProperty('--accent', phase.accent);
    els.panel.style.setProperty('--accent-rgb', phase.rgb);
    els.phaseLabel.textContent = phase.label;
    els.cycleCount.textContent = String(state.cycle);
    els.totalCount.textContent = String(state.completed);
    els.dial.classList.toggle('running', state.running);
    els.toggleBtn.setAttribute('aria-pressed', String(state.running));
    els.toggleBtn.setAttribute('aria-label', state.running ? '暂停' : '开始');
    els.toggleLabel.textContent = state.running ? '暂停' : '开始';
    els.toggleIcon.innerHTML = state.running ? PAUSE_ICON : PLAY_ICON;

    if (state.running) {
      els.hint.textContent = state.phase === 'focus' ? '专注中，保持节奏' : '休息一下，放松眼睛';
    } else if (left < total) {
      els.hint.textContent = '已暂停';
    } else {
      els.hint.textContent = state.phase === 'focus' ? '点击开始专注' : '点击开始休息';
    }
  }

  function tick() {
    if (!state.running) return;
    const left = (state.endsAt || 0) - Date.now();
    if (left <= 0) {
      state.remaining = 0;
      render(true);
      finishPhase();
      return;
    }
    state.remaining = left;
    render(false);
  }

  function start() {
    if (state.running) return;
    if (state.remaining <= 0) state.remaining = duration(state.phase);
    unlockAudio();
    state.running = true;
    state.endsAt = Date.now() + state.remaining;
    render(true);
    saveState();
    emitChanged();
  }

  function pause() {
    if (!state.running) return;
    state.remaining = Math.max(0, (state.endsAt || 0) - Date.now());
    state.running = false;
    state.endsAt = null;
    render(true);
    saveState();
    emitChanged();
  }

  function toggle() {
    if (state.running) pause();
    else start();
  }

  function reset() {
    state.running = false;
    state.endsAt = null;
    state.remaining = duration(state.phase);
    render(true);
    saveState();
    emitChanged();
  }

  function finishPhase(options) {
    const silent = !!(options && options.silent);
    const finished = state.phase;
    const wasFocus = finished === 'focus';

    if (wasFocus) {
      state.completed += 1;
      state.cycle = Math.min(state.cycle + 1, CONFIG.cycle);
    }

    let next;
    if (wasFocus) {
      next = state.cycle >= CONFIG.cycle ? 'long' : 'short';
    } else {
      next = 'focus';
      if (finished === 'long') state.cycle = 0;
    }

    state.phase = next;
    state.remaining = duration(next);
    state.running = false;
    state.endsAt = null;

    render(true);
    saveState();
    bridge.emit('pomodoro:complete', {
      finished,
      next,
      completed: state.completed,
      cycle: state.cycle,
    });
    emitChanged();

    if (!silent) {
      if (CONFIG.chime) playChime(wasFocus);
      flash();
    }
  }

  function skip() {
    const current = state.phase;
    if (current === 'long') state.cycle = 0;

    let next;
    if (current === 'focus') {
      next = state.cycle >= CONFIG.cycle ? 'long' : 'short';
    } else {
      next = 'focus';
    }

    state.phase = next;
    state.remaining = duration(next);
    state.running = false;
    state.endsAt = null;
    render(true);
    saveState();
    bridge.emit('pomodoro:skip', { from: current, to: next });
    emitChanged();
  }

  function flash() {
    els.panel.classList.remove('flash');
    void els.panel.offsetWidth;
    els.panel.classList.add('flash');
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => els.panel.classList.remove('flash'), 1000);
  }

  // ── 提示音：Web Audio 合成，无外部资源 ───────────────────────────
  let audioContext = null;

  function unlockAudio() {
    if (audioContext) {
      if (audioContext.state === 'suspended') audioContext.resume().catch(() => {});
      return;
    }
    const AudioCtor = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtor) return;
    try { audioContext = new AudioCtor(); } catch (error) {}
  }

  function playChime(focusFinished) {
    if (!audioContext) return;
    try {
      if (audioContext.state === 'suspended') audioContext.resume().catch(() => {});
      const now = audioContext.currentTime;
      const notes = focusFinished ? [659.25, 987.77, 1318.51] : [783.99, 523.25];
      notes.forEach((frequency, index) => {
        const start = now + index * 0.14;
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.type = 'sine';
        osc.frequency.value = frequency;
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.09, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.55);
        osc.connect(gain).connect(audioContext.destination);
        osc.start(start);
        osc.stop(start + 0.6);
      });
    } catch (error) {}
  }
  // ─────────────────────────────────────────────────────────────────

  els.toggleBtn.addEventListener('click', toggle);
  els.resetBtn.addEventListener('click', reset);
  els.skipBtn.addEventListener('click', skip);
  els.dial.addEventListener('click', toggle);
  els.dial.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      toggle();
    }
  });

  document.addEventListener('keydown', event => {
    if (event.defaultPrevented || event.metaKey || event.ctrlKey || event.altKey) return;
    const target = event.target;
    if (target && target.closest && target.closest('button')) return;
    if (event.code === 'Space') {
      event.preventDefault();
      toggle();
    } else if (event.key === 'r' || event.key === 'R') {
      reset();
    } else if (event.key === 's' || event.key === 'S') {
      skip();
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) tick();
  });

  // agent 控制：PinShell emit pomodoro:command '{"action":"start|pause|toggle|reset|skip"}'
  bridge.on('pomodoro:command', data => {
    const action = typeof data === 'string' ? data : data && data.action;
    if (!action) return;
    switch (String(action).toLowerCase()) {
      case 'start': start(); break;
      case 'pause': pause(); break;
      case 'toggle': toggle(); break;
      case 'reset': reset(); break;
      case 'skip': skip(); break;
    }
  });

  // 便于 eval / 调试
  window.pomodoro = { start, pause, toggle, reset, skip, snapshot };

  const expiredWhileClosed = state.running && state.remaining <= 0;
  if (expiredWhileClosed) {
    finishPhase({ silent: true });
  } else {
    if (!state.running && state.remaining <= 0) state.remaining = duration(state.phase);
    render(true);
    saveState();
    emitChanged();
  }

  setInterval(tick, 250);
</script>
</body>
</html>
