<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>目标进度</title>
<link rel="stylesheet" href="design-tokens.css">
<style>
.card {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 10px;
  padding: 0 16px;
  background: var(--ps-surface-tile-1);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: var(--ps-radius-lg);
  box-sizing: border-box;
}
.head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}
.title {
  font-size: 12px;
  letter-spacing: 0.02em;
  color: var(--ps-body-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.nums {
  font-size: 13px; font-weight: 600;
  font-variant-numeric: tabular-nums;   /* 数字等宽，更新不抖动 */
  color: var(--ps-body-on-dark);
  white-space: nowrap;
}
.nums .cur { color: var(--ps-primary-on-dark); }   /* 当前值点亮 */
.track {
  position: relative;
  height: 6px;
  border-radius: var(--ps-radius-pill);
  background: rgba(255, 255, 255, 0.10);
  overflow: hidden;
}
.fill {
  position: relative;
  height: 100%;
  width: 0;
  border-radius: inherit;
  background: linear-gradient(90deg, #FD3532, #FF7A1A);   /* 品牌红 → 暖橙 */
  transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
}
/* 扫过高光：亮度流动感 */
.fill::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
  transform: translateX(-100%);
  animation: shimmer 2.4s ease-in-out infinite;
}
@keyframes shimmer {
  0% { transform: translateX(-100%); }
  60%, 100% { transform: translateX(100%); }
}
</style>
</head>
<body>
<div class="card ps-dim-surface">
  <div class="head">
    <span class="title" id="title">订阅目标</span>
    <span class="nums"><span class="cur" id="cur">128</span><span id="total"> / 500</span></span>
  </div>
  <div class="track"><div class="fill" id="fill"></div></div>
</div>
<script>
// 业务数据：直播中自行更新（PinShell 不介入）
const TARGET = { current: 128, goal: 500 };
const titleEl = document.getElementById("title");
const curEl = document.getElementById("cur");
const totalEl = document.getElementById("total");
const fillEl = document.getElementById("fill");
function render() {
  curEl.textContent = TARGET.current;
  totalEl.textContent = " / " + TARGET.goal;
  fillEl.style.width = Math.min(100, (TARGET.current / TARGET.goal) * 100) + "%";
}
render();
// 演示节奏：进度持续推进（业务接入时删除本段）
let demo = TARGET.current;
setInterval(() => {
  if (document.hidden) return;   // 遮挡/后台时停止唤醒
  demo += 7;
  if (demo > TARGET.goal) demo = 20;
  TARGET.current = demo;
  render();
}, 4000);
</script>
</body>
</html>
