<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PinShell</title>
<style>
/* tokens：surface-pearl / hairline / rounded.lg / Action Blue / ink */
html, body {
  width: 100%; height: 100%;
  margin: 0; padding: 0;
  background: transparent;
  overflow: hidden;
  font-family: "SF Pro Text", system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.card {
  position: absolute;
  inset: 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: #fafafc;
  border: 1px solid #e0e0e0;
  border-radius: 18px;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08), 0 6px 14px rgba(0, 0, 0, 0.10);  /* 悬浮投影（Placeholder 不引 tokens，值同 --ps-shadow-float） */
}
.dot {
  width: 8px; height: 8px;
  border-radius: 9999px;
  background: #0066cc;
}
.title {
  font-family: "SF Pro Display", system-ui, -apple-system, sans-serif;
  font-size: 15px; font-weight: 600;
  letter-spacing: -0.22px;
  color: #1d1d1f;
}
.hint {
  font-size: 10px;
  letter-spacing: -0.08px;
  color: #7a7a7a;
}
</style>
</head>
<body>
<div class="card">
  <span class="dot"></span>
  <span class="title">PinShell</span>
  <span class="hint">⌘K → 在线模板库</span>
</div>
</body>
</html>
